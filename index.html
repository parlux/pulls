<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greyskull Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;
    --surface: #141416;
    --surface2: #1c1c20;
    --border: #2a2a30;
    --text: #e8e6e0;
    --muted: #6b6870;
    --accent: #e8a020;
    --accent2: #d63a2f;
    --green: #3ab06a;
    --blue: #5b8def;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Instrument Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0 0 72px;
  }

  /* ─── TOP NAV ─── */
  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .top-nav h1 { font-family: var(--font-display); font-size: 26px; letter-spacing: 2px; color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .sync-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--accent2); }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .refresh-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0;
    background: none; border: none; cursor: pointer; color: var(--muted);
    transition: color 0.15s;
  }
  .refresh-btn:hover { color: var(--accent); }
  .refresh-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── BOTTOM TAB BAR ─── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 100;
  }
  .tab-btn {
    flex: 1; padding: 10px 8px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-family: var(--font-body); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.15s;
  }
  .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab-btn.active { color: var(--accent); }

  /* ─── VIEWS ─── */
  .view { display: none; }
  .view.active { display: block; }
  .container { max-width: 560px; margin: 0 auto; padding: 20px; }

  /* ─── LOG VIEW ─── */
  .section-lbl {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent2); margin-bottom: 10px;
  }
  .log-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .log-header .section-lbl { margin-bottom: 0; }
  .log-date { font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; color: var(--muted); }

  .ex-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s;
  }
  .ex-card.ready {
    border-left: 3px solid var(--accent);
  }
  .ex-card.completed {
    opacity: 0.65;
  }
  .ex-card.completed .inputs-row,
  .ex-card.completed .card-footer {
    opacity: 1;
  }

  .ex-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 10px;
  }
  .ex-name { font-size: 15px; font-weight: 600; }
  .ex-today {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--green);
  }
  .ex-last-set { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .variant-pills {
    display: flex; gap: 6px; padding: 0 16px 12px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .variant-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); border-radius: 999px; padding: 5px 12px;
    cursor: pointer; font-family: var(--font-body); font-size: 12px; font-weight: 600;
    transition: all 0.12s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { border-color: var(--accent); background: #1f1a10; color: var(--accent); }

  .inputs-row { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 16px 10px; }
  .ex-target-row { padding: 0 16px 4px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em; }
  .ex-target-row.progression { color: var(--green); }

  .ex-progress-track {
    margin: 0 16px 10px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .ex-progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.25s ease, background-color 0.25s ease;
  }
  .ex-progress-fill.complete {
    background: var(--green);
  }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .num-input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--font-display);
    font-size: 32px; padding: 8px 12px; width: 100%; text-align: center;
    transition: border-color 0.15s; -moz-appearance: textfield;
  }
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .num-input:focus { outline: none; border-color: var(--accent); }
  .num-input::placeholder { color: var(--border); }

  .card-footer { padding: 0 16px 16px; }
  .card-log-btn {
    width: 100%; padding: 10px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 6px; font-family: var(--font-display);
    font-size: 18px; letter-spacing: 1.5px; cursor: pointer; transition: all 0.15s;
  }
  .card-log-btn:hover { background: #f0b030; }
  .card-log-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* ─── HISTORY VIEW ─── */
  .section-title {
    font-family: var(--font-display); font-size: 22px; letter-spacing: 1px;
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; animation: slideIn 0.2s ease;
  }
  .hist-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;
  }
  .hist-date { font-family: var(--font-display); font-size: 20px; color: var(--accent); line-height: 1; }
  .hist-dow { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
  .hist-exercises { display: flex; flex-direction: column; gap: 5px; }
  .hist-ex {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 8px;
    align-items: baseline; font-size: 13px;
  }
  .hist-ex-name { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hist-ex-vol { font-weight: 600; }
  .hist-ex-var { font-size: 11px; color: var(--muted); text-align: right; }
  .hist-records {
    margin-top: 8px; border-top: 1px solid var(--border);
    padding-top: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .hist-record {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--muted);
  }
  .hist-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 2px 6px; border-radius: 3px; line-height: 1;
    font-family: var(--font-body);
  }
  .hist-del:hover { color: var(--accent2); }

  .export-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.12s;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── PROGRESS VIEW ─── */
  .stat-strip {
    display: flex; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; margin-bottom: 20px;
  }
  .stat-cell {
    flex: 1; padding: 14px 12px; text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-val { font-family: var(--font-display); font-size: 28px; color: var(--accent); line-height: 1; }
  .stat-val.green { color: var(--green); }
  .stat-lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .week-strip { display: flex; gap: 6px; margin-bottom: 24px; }

  .range-strip { display: flex; gap: 6px; margin-bottom: 20px; }
  .range-strip .pill { flex: 1; text-align: center; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .week-dot { width: 100%; max-width: 36px; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); }
  .week-dot.trained { background: var(--accent); border-color: var(--accent); }
  .week-dot-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }

  .chart-block { margin-bottom: 28px; }
  .chart-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .chart-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .legend-chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 8px 3px 6px;
  }
  .legend-chip .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .chart-wrap { position: relative; height: 160px; }
  .chart-empty { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; }

  /* ─── CALF VIEW ─── */
  .calf-daytype-badge {
    display: inline-block; font-family: var(--font-display); font-size: 16px;
    letter-spacing: 1px; color: var(--muted); padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px;
  }
  .calf-daytype-badge.a-day { color: var(--accent); border-color: var(--accent); }
  .calf-daytype-badge.b-day { color: var(--blue); border-color: var(--blue); }
  .calf-daytype-badge.off   { color: var(--muted); }

  .date-input, .text-input, .textarea-input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--font-body);
    font-size: 14px; padding: 10px 12px; width: 100%;
    transition: border-color 0.15s;
  }
  .date-input:focus, .text-input:focus, .textarea-input:focus { outline: none; border-color: var(--accent); }
  .textarea-input { resize: vertical; min-height: 60px; }

  .week-dot.future { opacity: 0.4; }
  .week-dot.off-day { border-style: dashed; }

  .hist-calf-row { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .hist-calf-assist { font-weight: 700; color: var(--text); }

  .calf-ex-block { margin-bottom: 20px; }
  .calf-ex-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
  .calf-ex-side-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 6px; }
  .set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .set-row .input-group { flex: 1; min-width: 80px; }
  .set-row .num-input { font-size: 22px; padding: 6px 10px; }
  .set-row-assist { flex-basis: 100%; padding: 0; margin: 0; }
  .set-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 8px; line-height: 1; font-family: var(--font-body); }
  .set-remove:hover { color: var(--accent2); }
  .add-set-btn { width: 100%; margin-bottom: 10px; }
  .calf-off-note { color: var(--muted); font-size: 13px; padding: 4px 0 14px; }

  /* ─── LOADING ─── */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 999; transition: opacity 0.4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-bar { width: 160px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loading-bar-inner { height: 100%; background: var(--accent); animation: loadbar 1.2s ease-in-out infinite; }
  @keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }

  .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; border: 1px dashed var(--border); border-radius: 8px; }
  .empty strong { display: block; font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; color: var(--border); margin-bottom: 6px; }

  @keyframes slideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

  @media (max-width: 440px) {
    .top-nav { padding: 14px 16px; }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:4px;color:var(--accent)">GREYSKULL</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:var(--muted)">SYNCING...</div>
</div>

<!-- TOP NAV -->
<div class="top-nav">
  <h1>GREYSKULL</h1>
  <div class="nav-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">—</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="load()" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
</div>

<!-- ─── LOG VIEW ─── -->
<div class="view active" id="viewLog">
  <div class="container">
    <div class="log-header">
      <div class="section-lbl">Exercises</div>
      <div class="log-date" id="logDate"></div>
    </div>
    <div id="exerciseCards"></div>
  </div>
</div>

<!-- ─── HISTORY VIEW ─── -->
<div class="view" id="viewHistory">
  <div class="container">
    <div class="section-title">
      <span>HISTORY</span>
      <button class="export-btn" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- ─── PROGRESS VIEW ─── -->
<div class="view" id="viewProgress">
  <div class="container">
    <div class="stat-strip">
      <div class="stat-cell">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-lbl">Days</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val green" id="statStreak">0</div>
        <div class="stat-lbl">Streak</div>
      </div>
      <div class="stat-cell">
        <div class="stat-val" id="statLast">—</div>
        <div class="stat-lbl">Last</div>
      </div>
    </div>

    <div class="week-strip" id="weekStrip"></div>

    <div class="range-strip" id="rangeStrip">
      <button class="pill" data-range="1w" onclick="setChartRange('1w')">1W</button>
      <button class="pill active" data-range="1m" onclick="setChartRange('1m')">1M</button>
      <button class="pill" data-range="3m" onclick="setChartRange('3m')">3M</button>
      <button class="pill" data-range="all" onclick="setChartRange('all')">All</button>
    </div>
    <div id="chartSections"></div>
  </div>
</div>

<!-- ─── CALF VIEW ─── -->
<div class="view" id="viewCalf">
  <div class="container">
    <div class="log-header">
      <div class="section-lbl">Calf Rehab</div>
      <input type="date" class="date-input" id="calfDate" style="width:auto" onchange="onCalfDateChange()">
    </div>
    <div class="calf-daytype-badge" id="calfDayTypeBadge"></div>

    <div id="calfExerciseSections"></div>

    <div class="input-group" style="margin-bottom:14px">
      <span class="input-lbl">Prior day's activity</span>
      <input class="text-input" type="text" id="calfPriorActivity" placeholder="e.g. skated, rode, long walk, nothing">
    </div>

    <div class="input-group" style="margin-bottom:14px">
      <span class="input-lbl">Soreness (optional)</span>
      <textarea class="textarea-input" id="calfSoreness" placeholder="Any soreness this morning?"></textarea>
    </div>

    <div class="card-footer" style="padding:0 0 20px">
      <button class="card-log-btn" id="calfLogBtn" onclick="logCalfEntry()">LOG</button>
    </div>

    <div class="section-lbl">This Week</div>
    <div class="week-strip" id="calfWeekStrip"></div>

    <div class="section-lbl">Left-Leg Assist Trend</div>
    <div class="chart-block" id="calfChartBlock">
      <div class="chart-wrap"><canvas id="calfChart"></canvas></div>
    </div>

    <div class="section-title"><span>CALF HISTORY</span><button class="export-btn" onclick="exportCalfCSV()">Export CSV</button></div>
    <div class="history-list" id="calfHistoryList"></div>
  </div>
</div>

<!-- BOTTOM TAB BAR -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabLog" onclick="showView('Log')">
    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    Log
  </button>
  <button class="tab-btn" id="tabHistory" onclick="showView('History')">
    <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    History
  </button>
  <button class="tab-btn" id="tabProgress" onclick="showView('Progress')">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Progress
  </button>
  <button class="tab-btn" id="tabCalf" onclick="showView('Calf')">
    <svg viewBox="0 0 24 24"><path d="M8 2v6.5a4 4 0 0 0 1.2 2.9L11 13v7a2 2 0 0 0 2 2h3a2 2 0 0 0 2-2v-3a4 4 0 0 0-4-4h-1l-1.8-1.6A4 4 0 0 1 10 8.5V2"/></svg>
    Calf
  </button>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const AT_TOKEN = 'patij5jqH0iaquE10.c6c9db88b8a895ba7aec072ac7ec08959bbcf07474e194bbd8845f08bf01ca3e';
const AT_BASE  = 'appskyRmm9tzyMPwn';
const AT_TABLE = 'Workouts';
const AT_URL   = `https://api.airtable.com/v0/${AT_BASE}/${encodeURIComponent(AT_TABLE)}`;
const AT_HEADS = { 'Authorization': `Bearer ${AT_TOKEN}`, 'Content-Type': 'application/json' };
const CACHE_KEY = 'greyskull_v2_cache';

const AT_CALF_TABLE = 'CalfRehab';
const AT_CALF_URL   = `https://api.airtable.com/v0/${AT_BASE}/${encodeURIComponent(AT_CALF_TABLE)}`;
const CALF_CACHE_KEY = 'greyskull_calf_v1_cache';

const CALF_SCHEDULE = ['Off', 'A', 'A', 'B', 'A', 'A', 'B']; // Date.getDay() index, Sun..Sat
const CALF_DAYTYPE_LABEL = { A: 'A-day', B: 'B-day', Off: 'Off' };
const ASSIST_LEVELS = ['Heavy', 'Moderate', 'Light', 'Barely touching'];
const ASSIST_VALUE = { Heavy: 1, Moderate: 2, Light: 3, 'Barely touching': 4 };

function calfDayType(dateStr) {
  return CALF_SCHEDULE[new Date(dateStr + 'T12:00:00').getDay()];
}

const EXERCISES = [
  { key: 'chinup', label: 'Chin Ups',  color: '#5b8def', variants: ['Band-Assisted', 'Negative', 'Full', 'Weighted'] },
  { key: 'pushup', label: 'Push Ups',  color: '#e8a020', variants: ['Incline', 'Knee', 'Full', 'Decline', 'Weighted'] },
  { key: 'deadbug', label: 'Deadbugs', color: '#3ab06a', variants: ['Bent-Knee', 'Straight-Leg', 'Iso Hold', 'Weighted'] },
  { key: 'burpee', label: 'Burpees',   color: '#d63a2f', variants: ['No Jump', 'No Pushup', 'Full'] },
];

let logs = [];
let charts = {};
let chartRange = '1m';
let calfLogs = [];
let calfCharts = {};
let calfSetsState = { heelRaise: { left: [], right: [] }, bigToe: { left: [], right: [] }, seated: [] };

const defaultState = () => ({
  chinup: { variant: 'Band-Assisted', sets: '1', reps: '' },
  pushup: { variant: 'Knee',          sets: '1', reps: '' },

// ─── AIRTABLE API ─────────────────────────────────────────────────────────────
async function atFetch(path = '', opts = {}, baseUrl = AT_URL) {
  const res = await fetch(baseUrl + path, { headers: AT_HEADS, ...opts });
  if (!res.ok) throw new Error(`AT ${res.status}: ${await res.text()}`);
  if (res.status === 204) return null;
  return res.json();
}

async function fetchAllLogs(signal) {
  let records = [], offset = null;
  do {
    const p = new URLSearchParams({ 'sort[0][field]': 'Timestamp', 'sort[0][direction]': 'desc', pageSize: 100 });
    if (offset) p.set('offset', offset);
    const data = await atFetch('?' + p, { signal });
    records = records.concat(data.records);
    offset = data.offset || null;
  } while (offset);
  return records.map(normalizeRecord);
}

function cap(s) { return s[0].toUpperCase() + s.slice(1); }

function normalizeRecord(r) {
  const f = r.fields;
  const log = { id: r.id, timestamp: f.Timestamp || '', date: f.Date || '', notes: f.Notes || '' };
  EXERCISES.forEach(ex => {
    const k = cap(ex.key);
    log[ex.key] = {
      variant: f[k + '_Variant'] || '',
      sets: f[k + '_Sets'] ?? null,
      reps: f[k + '_Reps'] ?? null,
    };
  });
  return log;
}

function buildFields(log) {
  const f = { Timestamp: log.timestamp, Date: log.date, Notes: log.notes || '' };
  EXERCISES.forEach(ex => {
    const k = cap(ex.key);
    const d = log[ex.key];
    f[k + '_Variant'] = d.variant || null;
    f[k + '_Sets']    = num(d.sets);
    f[k + '_Reps']    = num(d.reps);
  });
  return f;
}

function num(v) { return (v !== '' && v != null) ? Number(v) : null; }

async function createLog(log) {
  const data = await atFetch('', {
    method: 'POST',
    body: JSON.stringify({ records: [{ fields: buildFields(log) }] }),
  });
  return data.records[0].id;
}

async function updateLog(log) {
  await atFetch('', {
    method: 'PATCH',
    body: JSON.stringify({ records: [{ id: log.id, fields: buildFields(log) }] }),
  });
}

async function deleteLog(id) { await atFetch('/' + id, { method: 'DELETE' }); }

// ─── CALF AIRTABLE API ────────────────────────────────────────────────────────
async function fetchAllCalfLogs(signal) {
  let records = [], offset = null;
  do {
    const p = new URLSearchParams({ 'sort[0][field]': 'Timestamp', 'sort[0][direction]': 'desc', pageSize: 100 });
    if (offset) p.set('offset', offset);
    const data = await atFetch('?' + p, { signal }, AT_CALF_URL);
    records = records.concat(data.records);
    offset = data.offset || null;
  } while (offset);
  return records.map(normalizeCalfRecord);
}

function parseSetJSON(v) {
  if (!v) return [];
  try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch (e) { return []; }
}

function normalizeCalfRecord(r) {
  const f = r.fields;
  return {
    id: r.id,
    timestamp: f.Timestamp || '',
    date: f.Date || '',
    dayType: f.DayType || '',
    assist: f.RightAssist || '',
    assistAvg: f.RightAssistAvg ?? null,
    priorActivity: f.PriorActivity || '',
    soreness: f.Soreness || '',
    heelRaiseLeft:   parseSetJSON(f.HeelRaiseLeft_Sets),
    heelRaiseRight:  parseSetJSON(f.HeelRaiseRight_Sets),
    bigToeLeft:      parseSetJSON(f.BigToeLeft_Sets),
    bigToeRight:     parseSetJSON(f.BigToeRight_Sets),
    seatedCalfRaise: parseSetJSON(f.SeatedCalfRaise_Sets),
  };
}

function buildCalfFields(entry) {
  return {
    Timestamp: entry.timestamp,
    Date: entry.date,
    DayType: entry.dayType || null,
    // Airtable fields keep their legacy Right* names but hold the left-leg assist
    RightAssist: entry.assist || null,
    RightAssistAvg: entry.assistAvg ?? null,
    PriorActivity: entry.priorActivity || '',
    Soreness: entry.soreness || '',
    HeelRaiseLeft_Sets:   entry.heelRaiseLeft?.length   ? JSON.stringify(entry.heelRaiseLeft)   : null,
    HeelRaiseRight_Sets:  entry.heelRaiseRight?.length  ? JSON.stringify(entry.heelRaiseRight)  : null,
    BigToeLeft_Sets:      entry.bigToeLeft?.length      ? JSON.stringify(entry.bigToeLeft)      : null,
    BigToeRight_Sets:     entry.bigToeRight?.length     ? JSON.stringify(entry.bigToeRight)     : null,
    SeatedCalfRaise_Sets: entry.seatedCalfRaise?.length ? JSON.stringify(entry.seatedCalfRaise) : null,
  };
}

async function createCalfLog(entry) {
  const data = await atFetch('', {
    method: 'POST',
    body: JSON.stringify({ records: [{ fields: buildCalfFields(entry) }] }),
  }, AT_CALF_URL);
  return data.records[0].id;
}

async function updateCalfLog(entry) {
  await atFetch('', {
    method: 'PATCH',
    body: JSON.stringify({ records: [{ id: entry.id, fields: buildCalfFields(entry) }] }),
  }, AT_CALF_URL);
}

async function deleteCalfLog(id) { await atFetch('/' + id, { method: 'DELETE' }, AT_CALF_URL); }

// ─── SYNC STATUS ──────────────────────────────────────────────────────────────
function setSync(status, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + status;
  document.getElementById('syncLabel').textContent = label;
  document.getElementById('refreshBtn').classList.toggle('spinning', status === 'syncing');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
let loadController = null;
async function load() {
  if (loadController) loadController.abort();
  const controller = new AbortController();
  loadController = controller;
  setSync('syncing', 'Syncing...');
  try {
    [logs, calfLogs] = await Promise.all([
      fetchAllLogs(controller.signal),
      fetchAllCalfLogs(controller.signal),
    ]);
    if (controller.signal.aborted) return;
    setSync('ok', 'Airtable ✓');
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
  } catch (e) {
    if (controller.signal.aborted) return;
    console.warn('Airtable unavailable, using cache:', e);
    setSync('err', 'Offline (cached)');
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) logs = JSON.parse(cached);
    const calfCached = localStorage.getItem(CALF_CACHE_KEY);
    if (calfCached) calfLogs = JSON.parse(calfCached);
  } finally {
    if (loadController === controller) loadController = null;
  }

  // Pre-fill each exercise variant from its most recent log entry
  EXERCISES.forEach(ex => {
    const recent = logs.find(l => l[ex.key]?.variant);
    if (recent) state[ex.key].variant = recent[ex.key].variant;
  });

  renderCards();
  renderHistory();
  if (document.getElementById('viewCalf')?.classList.contains('active')) {
    renderCalfForm();
    renderCalfWeek();
    renderCalfChart();
    renderCalfHistory();
  }

  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.classList.add('hidden');
    setTimeout(() => overlay.remove(), 400);
  }
}

// ─── VIEW SWITCHING ───────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view' + name).classList.add('active');
  document.getElementById('tab' + name).classList.add('active');
  if (name === 'Progress') renderProgress();
  if (name === 'Calf') { renderCalfForm(); renderCalfWeek(); renderCalfChart(); renderCalfHistory(); }
}

// ─── TARGET ───────────────────────────────────────────────────────────────────
function getLastSessionTarget(key) {
  const today = localDateKey(new Date());
  const pastDates = [...new Set(
    logs
      .filter(l => l.date !== today && l[key]?.sets != null && l[key]?.reps != null)
      .map(l => l.date)
  )].sort().reverse();

  if (!pastDates.length) return null;

  const lastDate = pastDates[0];
  const dayLogs = logs.filter(l => l.date === lastDate && l[key]?.sets != null && l[key]?.reps != null);
  const totalSets = dayLogs.reduce((sum, l) => sum + (l[key].sets || 1), 0);
  const repsPerSet = dayLogs[0]?.[key]?.reps;
  if (!repsPerSet) return null;

  return { sets: totalSets, repsPerSet };
}

function renderTargetRow(target, todaySets) {
  const pct = Math.min(100, Math.round((todaySets / target.sets) * 100));
  const complete = todaySets >= target.sets;
  const countText = todaySets > 0
    ? ` · ${todaySets} of ${target.sets} set${target.sets !== 1 ? 's' : ''}`
    : '';

  return `
    <div class="ex-target-row">
      Target: ${target.sets}×${target.repsPerSet}${countText}
    </div>
    <div class="ex-progress-track">
      <div class="ex-progress-fill${complete ? ' complete' : ''}" style="width:${pct}%"></div>
    </div>`;
}

// ─── LOG VIEW ─────────────────────────────────────────────────────────────────
function renderCards() {
  const container = document.getElementById('exerciseCards');
  container.innerHTML = '';
  const today = localDateKey(new Date());

  EXERCISES.forEach(ex => {
    const s = state[ex.key];

    // Aggregate today's totals for this exercise across all log records
    let todaySets = 0, todayReps = 0;
    logs.forEach(l => {
      if (l.date === today && l[ex.key].sets != null && l[ex.key].reps != null) {
        todaySets += l[ex.key].sets;
        todayReps += l[ex.key].sets * l[ex.key].reps;
      }
    });
    const totalsHtml = todaySets > 0
      ? `<span class="ex-today">${todaySets} set${todaySets !== 1 ? 's' : ''} · ${todayReps} reps</span>`
      : '';

    const lastSet = timeSinceLastSet(ex.key);
    const lastSetHtml = lastSet ? `<div class="ex-last-set">${lastSet}</div>` : '';

    const target = getLastSessionTarget(ex.key);
    const targetHtml = target ? renderTargetRow(target, todaySets) : '';
    const isComplete = target ? todaySets >= target.sets : false;

    const div = document.createElement('div');
    div.className = 'ex-card' + (isComplete ? ' completed' : (isReady(ex.key) ? ' ready' : ''));
    div.id = 'card-' + ex.key;
    div.innerHTML = `
      <div class="ex-header">
        <div>
          <span class="ex-name">${ex.label}</span>
          ${lastSetHtml}
        </div>
        ${totalsHtml}
      </div>
      ${targetHtml}
      <div class="variant-pills">
        ${ex.variants.map(v =>
          `<button class="pill${s.variant === v ? ' active' : ''}" onclick="setVariant('${ex.key}','${esc(v)}')">${h(v)}</button>`
        ).join('')}
      </div>
      <div class="inputs-row">
        <div class="input-group">
          <span class="input-lbl">Reps</span>
          <input class="num-input" type="number" inputmode="numeric" min="1" placeholder="—"
            id="reps-${ex.key}" value="${s.reps}"
            oninput="state['${ex.key}'].reps=this.value">
        </div>
      </div>
      <div class="card-footer">
        <button class="card-log-btn" id="logbtn-${ex.key}" onclick="logExercise('${ex.key}')">LOG</button>
      </div>`;
    container.appendChild(div);
  });
}

function setVariant(key, variant) {
  syncInputsToState();
  state[key].variant = variant;
  renderCards();
}

function syncInputsToState() {
  EXERCISES.forEach(ex => {
    const r = document.getElementById('reps-' + ex.key);
    if (r) state[ex.key].reps = r.value;
  });
}

// ─── LOG EXERCISE ─────────────────────────────────────────────────────────────
async function logExercise(key) {
  syncInputsToState();
  const s = state[key];
  const reps = num(s.reps);
  if (!reps) {
    const input = document.getElementById('reps-' + key);
    if (input) {
      input.focus();
      input.style.borderColor = 'var(--accent2)';
      setTimeout(() => { input.style.borderColor = ''; }, 1000);
    }
    return;
  }

  const btn = document.getElementById('logbtn-' + key);
  btn.disabled = true;
  btn.textContent = '...';
  setSync('syncing', 'Saving...');

  const now = new Date();
  const log = {
    timestamp: now.toISOString(),
    date: localDateKey(now),
    notes: '',
  };
  EXERCISES.forEach(ex => { log[ex.key] = { variant: '', sets: null, reps: null }; });
  log[key] = { variant: s.variant, sets: num(s.sets) || 1, reps: reps };

  try {
    log.id = await createLog(log);
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    log.id = localId();
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('err', 'Saved locally');
    alert('Airtable unavailable — kept locally.\n\n' + e.message);
  }

  // Reset reps only; keep variant and sets for quick re-logging
  state[key].reps = '';

  renderCards();
  renderHistory();

  const newBtn = document.getElementById('logbtn-' + key);
  if (newBtn) {
    newBtn.textContent = '✓';
    newBtn.style.background = 'var(--green)';
    setTimeout(() => { newBtn.textContent = 'LOG'; newBtn.style.background = ''; }, 1500);
  }
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
async function deleteEntry(key) {
  const log = logs.find(l => logKey(l) === key);
  if (!log || !confirm('Delete this entry?')) return;
  setSync('syncing', 'Deleting...');
  try {
    if (log.id && !log.id.startsWith('local-')) await deleteLog(log.id);
    logs = logs.filter(l => logKey(l) !== key);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Deleted');
    renderHistory();
    renderCards();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

// ─── HISTORY RENDER ───────────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('historyList');
  if (logs.length === 0) {
    list.innerHTML = '<div class="empty"><strong>NO LOGS YET</strong>Log your first set above.</div>';
    return;
  }

  // Group records by date
  const dateOrder = [];
  const byDate = {};
  logs.slice(0, 120).forEach(log => {
    if (!byDate[log.date]) {
      byDate[log.date] = { exercises: {}, records: [] };
      dateOrder.push(log.date);
    }
    byDate[log.date].records.push(log);

    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && !d.variant) return;
      if (!byDate[log.date].exercises[ex.key]) {
        byDate[log.date].exercises[ex.key] = { totalSets: 0, totalReps: 0, variant: '' };
      }
      const g = byDate[log.date].exercises[ex.key];
      if (d.sets != null) g.totalSets += d.sets;
      if (d.sets != null && d.reps != null) g.totalReps += d.sets * d.reps;
      if (d.variant) g.variant = d.variant;
    });
  });

  list.innerHTML = dateOrder.map(date => {
    const entry = byDate[date];

    const exRows = EXERCISES.map(ex => {
      const g = entry.exercises[ex.key];
      if (!g) return '';
      const vol = g.totalReps > 0
        ? `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''} · ${g.totalReps} reps`
        : `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''}`;
      return `<div class="hist-ex">
        <span class="hist-ex-name">${ex.label}</span>
        <span class="hist-ex-vol">${vol}</span>
        <span class="hist-ex-var">${h(g.variant)}</span>
      </div>`;
    }).filter(Boolean).join('');

    const recordRows = entry.records.map(log => {
      const key = logKey(log);
      const parts = EXERCISES
        .filter(ex => log[ex.key].sets != null)
        .map(ex => {
          const d = log[ex.key];
          return `${ex.label} ${d.sets}×${d.reps}`;
        });
      const desc = parts.join(' · ') || '—';
      return `<div class="hist-record">
        <span>${h(desc)}</span>
        <button class="hist-del" onclick="deleteEntry('${key}')" title="Delete">×</button>
      </div>`;
    }).join('');

    return `<div class="hist-item">
      <div class="hist-head">
        <span class="hist-date">${fmtDate(date)}</span>
        <span class="hist-dow">${fmtDow(date)}</span>
      </div>
      <div class="hist-exercises">
        ${exRows || '<span style="color:var(--muted);font-size:12px">Nothing logged</span>'}
      </div>
      <div class="hist-records">${recordRows}</div>
    </div>`;
  }).join('');
}

// ─── PROGRESS RENDER ──────────────────────────────────────────────────────────
function renderProgress() {
  renderStats();
  renderWeek();
  renderCharts();
}

function renderStats() {
  const uniqueDays = new Set(logs.map(l => l.date).filter(Boolean)).size;
  document.getElementById('statTotal').textContent = uniqueDays;
  document.getElementById('statStreak').textContent = calcStreak();
  if (logs.length > 0) {
    document.getElementById('statLast').textContent = fmtDate(logs[0].date);
  }
}

function calcStreak() {
  const dates = new Set(logs.map(l => l.date).filter(Boolean));
  const today = localDateKey(new Date());
  const yesterday = localDateKey(addDays(new Date(), -1));
  if (!dates.has(today) && !dates.has(yesterday)) return 0;
  let count = 0;
  let d = dates.has(today) ? new Date() : addDays(new Date(), -1);
  while (dates.has(localDateKey(d))) { count++; d = addDays(d, -1); }
  return count;
}

function renderWeek() {
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const trained = new Set(logs.map(l => l.date));
  for (let i = 6; i >= 0; i--) {
    const d = addDays(new Date(), -i);
    const ds = localDateKey(d);
    const wrap = document.createElement('div'); wrap.className = 'week-day';
    const dot = document.createElement('div'); dot.className = 'week-dot' + (trained.has(ds) ? ' trained' : '');
    const lbl = document.createElement('div'); lbl.className = 'week-dot-lbl';
    lbl.textContent = i === 0 ? 'Today' : days[d.getDay()];
    wrap.appendChild(dot); wrap.appendChild(lbl); strip.appendChild(wrap);
  }
}

function setChartRange(range) {
  chartRange = range;
  document.querySelectorAll('#rangeStrip .pill').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  renderCharts();
}

// ─── VARIANT COLORS (Progress charts) ─────────────────────────────────────────
// Keyed by a variant's position within its exercise's own `variants` array —
// identity only, not a difficulty ordering (e.g. pushup's array isn't a strict ladder).
const VARIANT_PALETTE = ['#5b8def', '#e8a020', '#3ab06a', '#d63a2f', '#a35bef', '#2fb8c4'];
const VARIANT_MISSED_COLOR = '#45454c';

function variantColor(ex, variant) {
  if (!variant) return VARIANT_MISSED_COLOR;
  const idx = ex.variants.indexOf(variant);
  return VARIANT_PALETTE[(idx < 0 ? 0 : idx) % VARIANT_PALETTE.length];
}

function segmentColor(ex, pts, ctx) {
  const p0 = pts[ctx.p0DataIndex];
  const p1 = pts[ctx.p1DataIndex];
  if (!p0.variant || !p1.variant) return VARIANT_MISSED_COLOR;
  return variantColor(ex, p1.variant);
}

function renderCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};

  const sections = document.getElementById('chartSections');
  sections.innerHTML = '';

  const todayDate = new Date();
  let cutoffDate;
  if (chartRange === 'all') {
    const earliest = logs.reduce((min, l) => (l.date && (!min || l.date < min)) ? l.date : min, null);
    cutoffDate = earliest ? new Date(earliest + 'T00:00:00') : addDays(todayDate, -30);
  } else {
    const days = { '1w': 7, '1m': 30, '3m': 90 }[chartRange] || 30;
    cutoffDate = addDays(todayDate, -(days - 1));
  }
  const cutoff = localDateKey(cutoffDate);

  EXERCISES.forEach(ex => {
    // Aggregate by date: sum sets×reps across all records per day
    const byDate = {};
    logs
      .filter(l => l.date >= cutoff && l[ex.key].sets != null && l[ex.key].reps != null)
      .forEach(l => {
        const d = l.date;
        if (!byDate[d]) byDate[d] = { date: d, total: 0, sets: 0, variant: l[ex.key].variant };
        byDate[d].total += l[ex.key].sets * l[ex.key].reps;
        byDate[d].sets += l[ex.key].sets;
        byDate[d].variant = l[ex.key].variant; // use most recent variant for label
      });
    const hasData = Object.keys(byDate).length > 0;

    // Fill every day in range so missed days show as 0 instead of being skipped
    const pts = [];
    for (let d = new Date(cutoffDate); d <= todayDate; d = addDays(d, 1)) {
      const ds = localDateKey(d);
      pts.push(byDate[ds] || { date: ds, total: 0, sets: 0, variant: '' });
    }

    const variantsInRange = ex.variants.filter(v => Object.values(byDate).some(d => d.variant === v));
    const legendHtml = variantsInRange.map(v =>
      `<span class="legend-chip"><span class="dot" style="background:${variantColor(ex, v)}"></span>${h(v)}</span>`
    ).join('');

    const block = document.createElement('div');
    block.className = 'chart-block';
    block.innerHTML = `
      <div class="chart-head">
        <span class="chart-title">${ex.label}</span>
        <div class="chart-legend">${legendHtml}</div>
      </div>
      ${!hasData
        ? `<div class="chart-empty">No data yet</div>`
        : `<div class="chart-wrap"><canvas id="chart-${ex.key}"></canvas></div>`
      }`;
    sections.appendChild(block);

    if (!hasData) return;

    const ctx = document.getElementById('chart-' + ex.key).getContext('2d');
    charts[ex.key] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: pts.map(p => fmtDate(p.date)),
        datasets: [{
          data: pts.map(p => p.total),
          borderColor: ex.color,
          backgroundColor: ex.color + '20',
          pointBackgroundColor: pts.map(p => variantColor(ex, p.variant)),
          pointBorderColor: pts.map(p => variantColor(ex, p.variant)),
          pointStyle: pts.map(p => p.variant ? 'circle' : 'crossRot'),
          pointRadius: pts.length > 45 ? 0 : 4,
          pointHoverRadius: 6,
          borderWidth: 2,
          segment: { borderColor: ctx => segmentColor(ex, pts, ctx) },
          fill: true,
          tension: 0.3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#141416',
            borderColor: '#2a2a30',
            borderWidth: 1,
            titleColor: '#e8e6e0',
            bodyColor: '#9b98a0',
            usePointStyle: true,
            callbacks: {
              label: item => {
                const p = pts[item.dataIndex];
                if (p.sets === 0) return 'Missed day';
                return `${p.sets} set${p.sets !== 1 ? 's' : ''} · ${p.total} reps · ${p.variant}`;
              },
            },
          },
        },
        scales: {
          x: {
            ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 7 },
            grid: { color: '#1c1c20' },
          },
          y: {
            min: 0,
            ticks: { color: '#6b6870', font: { size: 10 } },
            grid: { color: '#1c1c20' },
            title: { display: true, text: 'Total reps', color: '#6b6870', font: { size: 10 } },
          },
        },
      },
    });
  });
}

// ─── CALF RENDER ──────────────────────────────────────────────────────────────
function renderCalfForm() {
  const dateInput = document.getElementById('calfDate');
  if (!dateInput.value) dateInput.value = localDateKey(new Date());
  updateCalfDayTypeUI(dateInput.value);
}

function onCalfDateChange() {
  updateCalfDayTypeUI(document.getElementById('calfDate').value);
}

function updateCalfDayTypeUI(dateStr) {
  const type = calfDayType(dateStr); // 'A' | 'B' | 'Off'
  const badge = document.getElementById('calfDayTypeBadge');
  const d = new Date(dateStr + 'T12:00:00');
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  badge.textContent = `${dow} · ${CALF_DAYTYPE_LABEL[type]}`;
  badge.className = 'calf-daytype-badge ' + (type === 'A' ? 'a-day' : type === 'B' ? 'b-day' : 'off');

  resetCalfSetsState(type);
  loadCalfSetsFromExisting(dateStr);
  renderCalfExerciseSections(type);

  const existing = calfLogs.find(l => l.date === dateStr);
  document.getElementById('calfPriorActivity').value = existing?.priorActivity || '';
  document.getElementById('calfSoreness').value = existing?.soreness || '';
}

function loadCalfSetsFromExisting(dateStr) {
  const existing = calfLogs.find(l => l.date === dateStr);
  if (!existing) return;
  const lastAssist = (calfLogs.find(l => l.assist) || {}).assist || 'Moderate';

  if (existing.heelRaiseLeft?.length) calfSetsState.heelRaise.left = existing.heelRaiseLeft.map(s => ({ reps: String(s.reps), assist: s.assist || lastAssist }));
  if (existing.heelRaiseRight?.length) calfSetsState.heelRaise.right = existing.heelRaiseRight.map(s => ({ reps: String(s.reps) }));
  if (existing.bigToeLeft?.length) calfSetsState.bigToe.left = existing.bigToeLeft.map(s => ({ seconds: String(s.seconds) }));
  if (existing.bigToeRight?.length) calfSetsState.bigToe.right = existing.bigToeRight.map(s => ({ seconds: String(s.seconds) }));
  if (existing.seatedCalfRaise?.length) calfSetsState.seated = existing.seatedCalfRaise.map(s => ({ reps: String(s.reps), weight: String(s.weight) }));
}

function resetCalfSetsState(type) {
  const lastAssist = (calfLogs.find(l => l.assist) || {}).assist || 'Moderate';
  const recentB = calfLogs.find(l => (l.seatedCalfRaise || []).length);
  const lastWeight = recentB ? recentB.seatedCalfRaise[recentB.seatedCalfRaise.length - 1].weight : 10;

  if (type === 'A') {
    calfSetsState.heelRaise.left  = [{ reps: '', assist: lastAssist }, { reps: '', assist: lastAssist }, { reps: '', assist: lastAssist }];
    calfSetsState.heelRaise.right = [{ reps: '' }, { reps: '' }];
    calfSetsState.bigToe.left     = [{ seconds: '30' }, { seconds: '30' }, { seconds: '30' }];
    calfSetsState.bigToe.right    = [{ seconds: '30' }, { seconds: '30' }, { seconds: '30' }];
    calfSetsState.seated = [];
  } else if (type === 'B') {
    calfSetsState.seated = [{ reps: '', weight: String(lastWeight) }, { reps: '', weight: String(lastWeight) }];
    calfSetsState.heelRaise.left = []; calfSetsState.heelRaise.right = [];
    calfSetsState.bigToe.left = []; calfSetsState.bigToe.right = [];
  } else {
    calfSetsState.heelRaise.left = []; calfSetsState.heelRaise.right = [];
    calfSetsState.bigToe.left = []; calfSetsState.bigToe.right = [];
    calfSetsState.seated = [];
  }
}

function renderCalfExerciseSections(type) {
  const wrap = document.getElementById('calfExerciseSections');
  if (type === 'A') {
    wrap.innerHTML = `
      <div class="calf-ex-block">
        <div class="calf-ex-title">Two-up, one-down heel raise</div>
        <div class="calf-ex-side-lbl">Left</div>
        <div id="calfRows-heelRaise-left"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('heelRaise','left')">+ Add set</button>
        <div class="calf-ex-side-lbl">Right</div>
        <div id="calfRows-heelRaise-right"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('heelRaise','right')">+ Add set</button>
      </div>
      <div class="calf-ex-block">
        <div class="calf-ex-title">Big-toe press</div>
        <div class="calf-ex-side-lbl">Left</div>
        <div id="calfRows-bigToe-left"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('bigToe','left')">+ Add set</button>
        <div class="calf-ex-side-lbl">Right</div>
        <div id="calfRows-bigToe-right"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('bigToe','right')">+ Add set</button>
      </div>`;
    renderSetRows('heelRaise', 'left');
    renderSetRows('heelRaise', 'right');
    renderSetRows('bigToe', 'left');
    renderSetRows('bigToe', 'right');
  } else if (type === 'B') {
    wrap.innerHTML = `
      <div class="calf-ex-block">
        <div class="calf-ex-title">Seated calf raise</div>
        <div id="calfRows-seated"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('seated')">+ Add set</button>
      </div>`;
    renderSetRows('seated');
  } else {
    wrap.innerHTML = `<div class="calf-off-note">Off day — nothing scheduled.</div>`;
  }
}

function renderSetRows(exercise, side) {
  const containerId = side ? `calfRows-${exercise}-${side}` : `calfRows-${exercise}`;
  const container = document.getElementById(containerId);
  if (!container) return;
  const rows = exercise === 'seated' ? calfSetsState.seated : calfSetsState[exercise][side];

  container.innerHTML = rows.map((row, idx) => {
    const removeBtn = `<button class="set-remove" onclick="removeCalfSet('${exercise}','${side || ''}',${idx})" title="Remove set">×</button>`;

    if (exercise === 'heelRaise') {
      const assistPills = side === 'left' ? `
        <div class="variant-pills set-row-assist">
          ${ASSIST_LEVELS.map(v => `<button class="pill${row.assist === v ? ' active' : ''}" onclick="setCalfSetAssist(${idx},'${esc(v)}')">${h(v)}</button>`).join('')}
        </div>` : '';
      return `
        <div class="set-row">
          <div class="input-group">
            <span class="input-lbl">Set ${idx + 1} reps</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.reps)}"
              oninput="calfSetsState.heelRaise.${side}[${idx}].reps=this.value">
          </div>
          ${removeBtn}
          ${assistPills}
        </div>`;
    }

    if (exercise === 'bigToe') {
      return `
        <div class="set-row">
          <div class="input-group">
            <span class="input-lbl">Set ${idx + 1} seconds</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.seconds)}"
              oninput="calfSetsState.bigToe.${side}[${idx}].seconds=this.value">
          </div>
          ${removeBtn}
        </div>`;
    }

    return `
      <div class="set-row">
        <div class="input-group">
          <span class="input-lbl">Set ${idx + 1} reps</span>
          <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.reps)}"
            oninput="calfSetsState.seated[${idx}].reps=this.value">
        </div>
        <div class="input-group">
          <span class="input-lbl">Weight kg</span>
          <input class="num-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="—" value="${h(row.weight)}"
            oninput="calfSetsState.seated[${idx}].weight=this.value">
        </div>
        ${removeBtn}
      </div>`;
  }).join('');
}

function addCalfSet(exercise, side) {
  if (exercise === 'seated') {
    const last = calfSetsState.seated[calfSetsState.seated.length - 1];
    calfSetsState.seated.push({ reps: '', weight: last ? last.weight : '10' });
    renderSetRows('seated');
  } else if (exercise === 'heelRaise') {
    calfSetsState.heelRaise[side].push(side === 'left' ? { reps: '', assist: 'Moderate' } : { reps: '' });
    renderSetRows('heelRaise', side);
  } else {
    calfSetsState.bigToe[side].push({ seconds: '30' });
    renderSetRows('bigToe', side);
  }
}

function removeCalfSet(exercise, side, idx) {
  if (exercise === 'seated') {
    calfSetsState.seated.splice(idx, 1);
    renderSetRows('seated');
  } else {
    calfSetsState[exercise][side].splice(idx, 1);
    renderSetRows(exercise, side);
  }
}

function setCalfSetAssist(idx, level) {
  calfSetsState.heelRaise.left[idx].assist = level;
  renderSetRows('heelRaise', 'left');
}

async function logCalfEntry() {
  const dateStr = document.getElementById('calfDate').value || localDateKey(new Date());
  const type = calfDayType(dateStr);

  const heelRaiseLeft   = type === 'A' ? calfSetsState.heelRaise.left.map(r => ({ reps: num(r.reps), assist: r.assist || null })).filter(r => r.reps != null) : [];
  const heelRaiseRight  = type === 'A' ? calfSetsState.heelRaise.right.map(r => ({ reps: num(r.reps) })).filter(r => r.reps != null) : [];
  const bigToeLeft      = type === 'A' ? calfSetsState.bigToe.left.map(r => ({ seconds: num(r.seconds) })).filter(r => r.seconds != null) : [];
  const bigToeRight     = type === 'A' ? calfSetsState.bigToe.right.map(r => ({ seconds: num(r.seconds) })).filter(r => r.seconds != null) : [];
  const seatedCalfRaise = type === 'B' ? calfSetsState.seated.map(r => ({ reps: num(r.reps), weight: num(r.weight) })).filter(r => r.reps != null) : [];

  const assistVals = heelRaiseLeft.map(s => ASSIST_VALUE[s.assist]).filter(Boolean);
  const assistAvg = assistVals.length ? assistVals.reduce((a, b) => a + b, 0) / assistVals.length : null;
  const assist = assistAvg ? ASSIST_LEVELS[Math.round(assistAvg) - 1] : '';

  const existing = calfLogs.find(l => l.date === dateStr);

  const entry = {
    timestamp: existing ? existing.timestamp : new Date().toISOString(),
    date: dateStr,
    dayType: CALF_DAYTYPE_LABEL[type],
    assist,
    assistAvg,
    heelRaiseLeft, heelRaiseRight, bigToeLeft, bigToeRight, seatedCalfRaise,
    priorActivity: document.getElementById('calfPriorActivity').value.trim(),
    soreness: document.getElementById('calfSoreness').value.trim(),
  };

  const btn = document.getElementById('calfLogBtn');
  btn.disabled = true;
  btn.textContent = '...';
  setSync('syncing', 'Saving...');

  try {
    if (existing && !existing.id.startsWith('local-')) {
      entry.id = existing.id;
      await updateCalfLog(entry);
      calfLogs = calfLogs.filter(l => l.id !== existing.id);
    } else if (existing) {
      calfLogs = calfLogs.filter(l => l.id !== existing.id);
      entry.id = await createCalfLog(entry);
    } else {
      entry.id = await createCalfLog(entry);
    }
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    if (!entry.id) entry.id = existing ? existing.id : localId();
    calfLogs = calfLogs.filter(l => l.id !== entry.id);
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('err', 'Saved locally');
    alert('Airtable unavailable — kept locally.\n\n' + e.message);
  }

  btn.disabled = false;
  btn.textContent = 'LOG';

  renderCalfWeek();
  renderCalfChart();
  renderCalfHistory();
}

async function deleteCalfEntry(id) {
  if (!confirm('Delete this entry?')) return;
  setSync('syncing', 'Deleting...');
  try {
    if (id && !id.startsWith('local-')) await deleteCalfLog(id);
    calfLogs = calfLogs.filter(l => l.id !== id);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Deleted');
    renderCalfWeek();
    renderCalfChart();
    renderCalfHistory();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

function renderCalfWeek() {
  const strip = document.getElementById('calfWeekStrip');
  strip.innerHTML = '';
  const today = new Date();
  const todayKey = localDateKey(today);
  const dow = today.getDay(); // 0=Sun..6=Sat
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = addDays(today, mondayOffset);

  const loggedDates = new Set(calfLogs.map(l => l.date));
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const ds = localDateKey(d);
    const type = calfDayType(ds); // 'A'|'B'|'Off'
    const isFuture = ds > todayKey;
    const isLogged = loggedDates.has(ds);

    const wrap = document.createElement('div'); wrap.className = 'week-day';
    const dot = document.createElement('div');
    dot.className = 'week-dot' +
      (type === 'Off' ? ' off-day' : '') +
      (isLogged ? ' trained' : (isFuture ? ' future' : ''));
    const lbl = document.createElement('div'); lbl.className = 'week-dot-lbl';
    lbl.textContent = `${labels[i]} · ${type}`;
    wrap.appendChild(dot); wrap.appendChild(lbl); strip.appendChild(wrap);
  }
}

function renderCalfChart() {
  if (calfCharts.trend) { calfCharts.trend.destroy(); delete calfCharts.trend; }

  const aEntries = calfLogs
    .filter(l => l.dayType === 'A-day' && (l.assistAvg != null || l.assist))
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));

  const block = document.getElementById('calfChartBlock');
  if (aEntries.length === 0) {
    block.innerHTML = '<div class="chart-empty">No A-day entries yet</div>';
    return;
  }
  if (!document.getElementById('calfChart')) {
    block.innerHTML = '<div class="chart-wrap"><canvas id="calfChart"></canvas></div>';
  }

  // Fill every scheduled A-day between first and last entry so missed A-days show as gaps
  const first = new Date(aEntries[0].date + 'T00:00:00');
  const last = new Date();
  const byDate = {};
  aEntries.forEach(e => { byDate[e.date] = e; });

  const pts = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    const ds = localDateKey(d);
    if (calfDayType(ds) !== 'A') continue;
    const e = byDate[ds];
    const assistAvg = e ? (e.assistAvg != null ? e.assistAvg : (e.assist ? ASSIST_VALUE[e.assist] : null)) : null;
    pts.push(e ? { date: ds, assist: e.assist, assistAvg, heelRaiseLeft: e.heelRaiseLeft || [] } : { date: ds, assist: null, assistAvg: null, heelRaiseLeft: [] });
  }

  const ctx = document.getElementById('calfChart').getContext('2d');
  calfCharts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => fmtDate(p.date)),
      datasets: [{
        data: pts.map(p => p.assistAvg),
        spanGaps: false,
        borderColor: '#5b8def',
        backgroundColor: '#5b8def20',
        pointStyle: pts.map(p => p.assistAvg != null ? 'circle' : 'crossRot'),
        pointBackgroundColor: pts.map(p => p.assistAvg != null ? '#5b8def' : VARIANT_MISSED_COLOR),
        pointRadius: 4,
        pointHoverRadius: 6,
        borderWidth: 2,
        fill: false,
        tension: 0.3,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#141416',
          borderColor: '#2a2a30',
          borderWidth: 1,
          titleColor: '#e8e6e0',
          bodyColor: '#9b98a0',
          callbacks: {
            label: item => {
              const p = pts[item.dataIndex];
              if (p.assistAvg == null) return 'Not logged';
              const rounded = ASSIST_LEVELS[Math.round(p.assistAvg) - 1] || '';
              const setsStr = p.heelRaiseLeft.map(s => s.assist).filter(Boolean).join(', ');
              return `${rounded} (avg ${p.assistAvg.toFixed(2)})${setsStr ? ` · sets: ${setsStr}` : ''}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 7 },
          grid: { color: '#1c1c20' },
        },
        y: {
          min: 0.5, max: 4.5,
          ticks: {
            color: '#6b6870', font: { size: 10 }, stepSize: 1,
            callback: v => ({ 1: 'Heavy', 2: 'Moderate', 3: 'Light', 4: 'Barely touching' }[v] || ''),
          },
          grid: { color: '#1c1c20' },
        },
      },
    },
  });
}

function renderCalfSetDetail(l) {
  const lines = [];
  const hrL = l.heelRaiseLeft || [], hrR = l.heelRaiseRight || [];
  if (hrL.length || hrR.length) {
    const lStr = hrL.map(s => s.assist ? `${s.reps} (${s.assist})` : `${s.reps}`).join(', ');
    const rStr = hrR.map(s => s.reps).join(', ');
    lines.push(`Heel raise${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const btL = l.bigToeLeft || [], btR = l.bigToeRight || [];
  if (btL.length || btR.length) {
    const lStr = btL.map(s => `${s.seconds}s`).join(', ');
    const rStr = btR.map(s => `${s.seconds}s`).join(', ');
    lines.push(`Big-toe press${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const seated = l.seatedCalfRaise || [];
  if (seated.length) {
    lines.push(`Seated calf raise — ${seated.map(s => `${s.reps}×${s.weight}kg`).join(', ')}`);
  }
  return lines.map(line => `<span>${h(line)}</span>`).join('');
}

function renderCalfHistory() {
  const list = document.getElementById('calfHistoryList');
  if (calfLogs.length === 0) {
    list.innerHTML = '<div class="empty"><strong>NO CALF LOGS YET</strong>Log your first session above.</div>';
    return;
  }
  list.innerHTML = calfLogs.slice(0, 120).map(l => {
    const setDetail = renderCalfSetDetail(l);
    return `
    <div class="hist-item">
      <div class="hist-head">
        <span class="hist-date">${fmtDate(l.date)}</span>
        <span class="hist-dow">${fmtDow(l.date)}</span>
      </div>
      <div class="hist-calf-row">
        <span>${h(l.dayType)}${l.assist ? ` · <span class="hist-calf-assist">${h(l.assist)}</span>` : ''}</span>
        ${l.priorActivity ? `<span>Prior: ${h(l.priorActivity)}</span>` : ''}
        ${l.soreness ? `<span>Soreness: ${h(l.soreness)}</span>` : ''}
      </div>
      ${setDetail ? `<div class="hist-calf-row">${setDetail}</div>` : ''}
      <div class="hist-records">
        <div class="hist-record">
          <span></span>
          <button class="hist-del" onclick="deleteCalfEntry('${esc(l.id)}')" title="Delete">×</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function csvField(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const header = ['Date', 'Time', 'Exercise', 'Variant', 'Sets', 'Reps', 'Total Reps', 'Notes'];
  const rows = [header];

  logs.forEach(log => {
    const time = log.timestamp
      ? new Date(log.timestamp).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false })
      : '';
    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && d.reps == null) return;
      rows.push([
        log.date,
        time,
        ex.label,
        d.variant || '',
        d.sets ?? '',
        d.reps ?? '',
        (d.sets != null && d.reps != null) ? d.sets * d.reps : '',
        log.notes || '',
      ]);
    });
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `greyskull-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCalfCSV() {
  const header = ['Date', 'DayType', 'Exercise', 'Side', 'Set', 'Reps', 'Seconds', 'Weight_kg', 'Assist', 'PriorActivity', 'Soreness'];
  const rows = [header];

  const pushRows = (l, arr, exLabel, side, repsKey, secondsKey, weightKey) => {
    (arr || []).forEach((s, idx) => {
      rows.push([
        l.date, l.dayType, exLabel, side, idx + 1,
        repsKey ? (s[repsKey] ?? '') : '',
        secondsKey ? (s[secondsKey] ?? '') : '',
        weightKey ? (s[weightKey] ?? '') : '',
        s.assist || '',
        l.priorActivity || '',
        l.soreness || '',
      ]);
    });
  };

  calfLogs.forEach(l => {
    pushRows(l, l.heelRaiseLeft,    'Heel raise',        'Left',  'reps', null, null);
    pushRows(l, l.heelRaiseRight,   'Heel raise',        'Right', 'reps', null, null);
    pushRows(l, l.bigToeLeft,       'Big-toe press',     'Left',  null, 'seconds', null);
    pushRows(l, l.bigToeRight,      'Big-toe press',     'Right', null, 'seconds', null);
    pushRows(l, l.seatedCalfRaise,  'Seated calf raise', '',      'reps', null, 'weight');
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calf-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const READY_AFTER_MS = 60 * 60 * 1000;
function isReady(key) {
  const entry = logs.find(l => l[key].reps != null);
  if (!entry || !entry.timestamp) return true;
  return Date.now() - new Date(entry.timestamp).getTime() >= READY_AFTER_MS;
}
function timeSinceLastSet(key) {
  const entry = logs.find(l => l[key].reps != null);
  if (!entry || !entry.timestamp) return null;
  const secs = Math.floor((Date.now() - new Date(entry.timestamp).getTime()) / 1000);
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}
function localDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function logKey(l) { return l.id || l.timestamp; }
function localId() { return 'local-' + (window.crypto?.randomUUID?.() || Date.now()); }
function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}
function fmtDow(ds) {
  return new Date(ds + 'T12:00:00').toLocaleDateString('en-AU', { weekday: 'long' });
}
function h(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(v) { return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

(() => {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('logDate').textContent = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
})();

load();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load();
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) load();
});
window.addEventListener('online', () => load());
</script>
