<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Greyskull">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Greyskull Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0c0e;
    --surface: #141416;
    --surface2: #1c1c20;
    --border: #2a2a30;
    --text: #e8e6e0;
    --muted: #6b6870;
    --accent: #e8a020;
    --accent2: #d63a2f;
    --green: #3ab06a;
    --blue: #5b8def;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Instrument Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0 0 calc(72px + env(safe-area-inset-bottom, 0px));
  }

  /* ─── TOP NAV ─── */
  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; padding-top: calc(18px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .top-nav h1 { font-family: var(--font-display); font-size: 26px; letter-spacing: 2px; color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .sync-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
  .sync-dot.ok { background: var(--green); }
  .sync-dot.err { background: var(--accent2); }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .refresh-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; padding: 0;
    background: none; border: none; cursor: pointer; color: var(--muted);
    transition: color 0.15s;
  }
  .refresh-btn:hover { color: var(--accent); }
  .refresh-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .refresh-btn.spinning svg { animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── BOTTOM TAB BAR ─── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    display: flex; z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn {
    flex: 1; padding: 10px 8px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; cursor: pointer; color: var(--muted);
    font-family: var(--font-body); font-size: 10px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.15s;
  }
  .tab-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab-btn.active { color: var(--accent); }

  /* ─── VIEWS ─── */
  .view { display: none; }
  .view.active { display: block; }
  .container { max-width: 560px; margin: 0 auto; padding: 20px; }

  /* ─── LOG VIEW ─── */
  .section-lbl {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--accent2); margin-bottom: 10px;
  }
  .log-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .log-header .section-lbl { margin-bottom: 0; }
  .log-date { font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; color: var(--muted); }

  .variant-pills {
    display: flex; gap: 6px; padding: 0 16px 12px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .variant-pills::-webkit-scrollbar { display: none; }
  .pill {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); border-radius: 999px; padding: 5px 12px;
    cursor: pointer; font-family: var(--font-body); font-size: 12px; font-weight: 600;
    transition: all 0.12s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .pill.active { border-color: var(--accent); background: #1f1a10; color: var(--accent); }


  .log-summary {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  .log-summary-num { font-family: var(--font-display); font-size: 40px; line-height: 0.9; color: var(--accent); font-variant-numeric: tabular-nums; }
  .log-summary-num small { font-size: 22px; color: var(--muted); }
  .log-summary-meta { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .log-summary-meta .section-lbl { margin-bottom: 0; color: var(--muted); }
  .log-summary-bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .log-summary-bar div { height: 100%; background: var(--accent); transition: width 0.25s ease; }
  .log-summary-bar div.complete { background: var(--green); }
  .log-summary .log-date { font-family: var(--font-body); font-size: 12px; letter-spacing: 0; }

  .ex-group-lbl { margin: 16px 0 8px; color: var(--muted); }
  .ex-group-lbl:first-of-type { margin-top: 0; }
  .ex-row {
    display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px;
    padding: 10px 14px; margin-bottom: 8px; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: var(--font-body); cursor: pointer; transition: border-color 0.15s;
  }
  .ex-row:hover, .ex-row:focus-visible { border-color: var(--accent); outline: none; }
  .ex-row-main { flex: 1; min-width: 0; }
  .ex-row-name { display: block; font-size: 15px; font-weight: 600; }
  .ex-row-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .ex-row-state { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ex-row-state.ready { color: var(--accent); }
  .ex-row-chev { color: var(--muted); font-size: 20px; line-height: 1; }
  .ex-row.done { min-height: 44px; background: transparent; border-style: dashed; }
  .ex-row.done .ex-row-name { font-size: 14px; color: var(--muted); }
  .ex-row-check { color: var(--green); font-weight: 700; }
  .ex-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3.5; }
  .ring .ring-track { stroke: var(--border); }
  .ring .ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dasharray 0.25s ease; }
  .ring .ring-fill.complete { stroke: var(--green); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ─── LOG SHEET ─── */
  .sheet-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
    max-width: 560px; margin: 0 auto;
    background: var(--surface); border-top: 1px solid var(--border); border-radius: 22px 22px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: 16px;
    transform: translateY(100%); transition: transform 0.25s ease;
  }
  .sheet-open .sheet-scrim { opacity: 1; pointer-events: auto; }
  .sheet-open .sheet { transform: translateY(0); }
  .sheet-grab { width: 38px; height: 4px; background: var(--border); border-radius: 2px; align-self: center; }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sheet-title { font-size: 21px; font-weight: 700; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .set-dots { display: flex; gap: 5px; padding-top: 6px; }
  .set-dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--border); }
  .set-dots i.filled { background: var(--accent); border-color: var(--accent); }
  .sheet .variant-pills { padding: 0; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .stepper-btn {
    width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
    font-family: var(--font-body); font-size: 32px; font-weight: 300; line-height: 1; cursor: pointer;
  }
  .stepper-btn:active { border-color: var(--accent); color: var(--accent); }
  .stepper-val { text-align: center; }
  .stepper-val b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 92px; line-height: 0.85; font-variant-numeric: tabular-nums; }
  .quick-reps { display: flex; gap: 6px; justify-content: center; }
  .quick-reps button {
    min-width: 44px; padding: 7px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: none; color: var(--muted);
    font-family: var(--font-body); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .quick-reps button.active { color: var(--text); border-color: var(--muted); }
  .sheet .card-log-btn { padding: 15px; font-size: 22px; border-radius: 12px; }

  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .input-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .num-input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--font-display);
    font-size: 32px; padding: 8px 12px; width: 100%; text-align: center;
    transition: border-color 0.15s; -moz-appearance: textfield;
  }
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .num-input:focus { outline: none; border-color: var(--accent); }
  .num-input::placeholder { color: var(--border); }

  .card-footer { padding: 0 16px 16px; }
  .card-log-btn {
    width: 100%; padding: 10px; background: var(--accent); color: var(--bg);
    border: none; border-radius: 6px; font-family: var(--font-display);
    font-size: 18px; letter-spacing: 1.5px; cursor: pointer; transition: all 0.15s;
  }
  .card-log-btn:hover { background: #f0b030; }
  .card-log-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* ─── HISTORY VIEW ─── */
  .section-title {
    font-family: var(--font-display); font-size: 22px; letter-spacing: 1px;
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .hist-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; animation: slideIn 0.2s ease;
  }
  .hist-head {
    display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;
  }
  .hist-date { font-family: var(--font-display); font-size: 20px; color: var(--accent); line-height: 1; }
  .hist-dow { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.06em; }
  .hist-exercises { display: flex; flex-direction: column; gap: 5px; }
  .hist-ex {
    display: grid; grid-template-columns: 72px 1fr auto; gap: 8px;
    align-items: baseline; font-size: 13px;
  }
  .hist-ex-name { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hist-ex-vol { font-weight: 600; }
  .hist-ex-var { font-size: 11px; color: var(--muted); text-align: right; }
  .hist-records {
    margin-top: 8px; border-top: 1px solid var(--border);
    padding-top: 8px; display: flex; flex-direction: column; gap: 4px;
  }
  .hist-record {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--muted);
  }
  .hist-del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 2px 6px; border-radius: 3px; line-height: 1;
    font-family: var(--font-body);
  }
  .hist-del:hover { color: var(--accent2); }

  .export-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
    font-family: var(--font-body); font-size: 11px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.12s;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── PROGRESS VIEW ─── */
  .week-strip { display: flex; gap: 6px; margin-bottom: 24px; }
  .week-day { display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1; }
  .week-dot { width: 100%; max-width: 36px; aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface); }
  .week-dot.trained { background: var(--accent); border-color: var(--accent); }
  .week-dot-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }

  .ex-pills { margin: 0 -20px 14px; padding: 0 20px; }
  .ex-pills .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; font-size: 13px; }
  .ex-pills .dot { width: 8px; height: 8px; border-radius: 50%; }

  .seg {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px;
  }
  .seg button {
    min-height: 32px; border: none; border-radius: 7px; background: none; cursor: pointer; color: var(--muted);
    font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .seg button.active { background: var(--border); color: var(--text); }

  .focus-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .focus-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 10px; }
  .focus-val { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
  .focus-val b { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .focus-val span { font-size: 13px; font-weight: 600; }
  .focus-delta { font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; }
  .focus-delta.up { color: var(--green); }
  .focus-delta.down { color: var(--accent2); }
  .focus-chart { position: relative; height: 220px; margin-bottom: 8px; }
  .focus-bars { position: relative; height: 44px; margin: 4px 0 16px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .kpi .focus-lbl { font-size: 9px; letter-spacing: 0.12em; }
  .kpi b { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 0.9; font-variant-numeric: tabular-nums; }
  .kpi span:last-child { font-size: 11px; color: var(--muted); }

  .chart-block { margin-bottom: 28px; }
  .chart-wrap { position: relative; height: 160px; }
  .chart-empty { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; }

  /* ─── CALF VIEW ─── */
  .calf-daytype-badge {
    display: inline-block; font-family: var(--font-display); font-size: 16px;
    letter-spacing: 1px; color: var(--muted); padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 6px; margin-bottom: 14px;
  }
  .calf-daytype-badge.a-day { color: var(--accent); border-color: var(--accent); }
  .calf-daytype-badge.b-day { color: var(--blue); border-color: var(--blue); }
  .calf-daytype-badge.off   { color: var(--muted); }

  .date-input, .text-input, .textarea-input {
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 6px; color: var(--text); font-family: var(--font-body);
    font-size: 14px; padding: 10px 12px; width: 100%;
    transition: border-color 0.15s;
  }
  .date-input:focus, .text-input:focus, .textarea-input:focus { outline: none; border-color: var(--accent); }
  .textarea-input { resize: vertical; min-height: 60px; }

  .week-dot.future { opacity: 0.4; }
  .week-dot.off-day { border-style: dashed; }

  .hist-calf-row { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .hist-calf-assist { font-weight: 700; color: var(--text); }

  .calf-ex-block { margin-bottom: 20px; }
  .calf-ex-title { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
  .calf-ex-side-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 10px 0 6px; }
  .set-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .set-row .input-group { flex: 1; min-width: 80px; }
  .set-row .num-input { font-size: 22px; padding: 6px 10px; }
  .set-row-assist { flex-basis: 100%; padding: 0; margin: 0; }
  .set-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 8px; line-height: 1; font-family: var(--font-body); }
  .set-remove:hover { color: var(--accent2); }
  .add-set-btn { width: 100%; margin-bottom: 10px; }
  .calf-off-note { color: var(--muted); font-size: 13px; padding: 4px 0 14px; }

  /* ─── LOADING ─── */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; z-index: 999; transition: opacity 0.4s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-bar { width: 160px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loading-bar-inner { height: 100%; background: var(--accent); animation: loadbar 1.2s ease-in-out infinite; }
  @keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }

  .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; border: 1px dashed var(--border); border-radius: 8px; }
  .empty strong { display: block; font-family: var(--font-display); font-size: 20px; letter-spacing: 1px; color: var(--border); margin-bottom: 6px; }

  @keyframes slideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }

  @media (max-width: 440px) {
    .top-nav { padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
    .container { padding: 16px; }
    .ex-pills { margin: 0 -16px 14px; padding: 0 16px; }
  }
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:4px;color:var(--accent)">GREYSKULL</div>
  <div class="loading-bar"><div class="loading-bar-inner"></div></div>
  <div style="font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:var(--muted)">SYNCING...</div>
</div>

<!-- TOP NAV -->
<div class="top-nav">
  <h1>GREYSKULL</h1>
  <div class="nav-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">—</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="load()" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
</div>

<!-- ─── LOG VIEW ─── -->
<div class="view active" id="viewLog">
  <div class="container">
    <div class="log-summary">
      <div class="log-summary-num" id="logSummaryNum"></div>

// ─── AIRTABLE API ─────────────────────────────────────────────────────────────
async function atFetch(path = '', opts = {}, baseUrl = AT_URL) {
  const res = await fetch(baseUrl + path, { headers: AT_HEADS, ...opts });
  if (!res.ok) throw new Error(`AT ${res.status}: ${await res.text()}`);
  if (res.status === 204) return null;
  return res.json();
}

async function fetchAllLogs(signal) {
  let records = [], offset = null;
  do {
    const p = new URLSearchParams({ 'sort[0][field]': 'Timestamp', 'sort[0][direction]': 'desc', pageSize: 100 });
    if (offset) p.set('offset', offset);
    const data = await atFetch('?' + p, { signal });
    records = records.concat(data.records);
    offset = data.offset || null;
  } while (offset);
  return records.map(normalizeRecord);
}

function cap(s) { return s[0].toUpperCase() + s.slice(1); }

function normalizeRecord(r) {
  const f = r.fields;
  const log = { id: r.id, timestamp: f.Timestamp || '', date: f.Date || '', notes: f.Notes || '' };
  EXERCISES.forEach(ex => {
    const k = cap(ex.key);
    log[ex.key] = {
      variant: f[k + '_Variant'] || '',
      sets: f[k + '_Sets'] ?? null,
      reps: f[k + '_Reps'] ?? null,
    };
  });
  return log;
}

function buildFields(log) {
  const f = { Timestamp: log.timestamp, Date: log.date, Notes: log.notes || '' };
  EXERCISES.forEach(ex => {
    const k = cap(ex.key);
    const d = log[ex.key];
    f[k + '_Variant'] = d.variant || null;
    f[k + '_Sets']    = num(d.sets);
    f[k + '_Reps']    = num(d.reps);
  });
  return f;
}

function num(v) { return (v !== '' && v != null) ? Number(v) : null; }

async function createLog(log) {
  const data = await atFetch('', {
    method: 'POST',
    body: JSON.stringify({ records: [{ fields: buildFields(log) }] }),
  });
  return data.records[0].id;
}

async function updateLog(log) {
  await atFetch('', {
    method: 'PATCH',
    body: JSON.stringify({ records: [{ id: log.id, fields: buildFields(log) }] }),
  });
}

async function deleteLog(id) { await atFetch('/' + id, { method: 'DELETE' }); }

// ─── CALF AIRTABLE API ────────────────────────────────────────────────────────
async function fetchAllCalfLogs(signal) {
  let records = [], offset = null;
  do {
    const p = new URLSearchParams({ 'sort[0][field]': 'Timestamp', 'sort[0][direction]': 'desc', pageSize: 100 });
    if (offset) p.set('offset', offset);
    const data = await atFetch('?' + p, { signal }, AT_CALF_URL);
    records = records.concat(data.records);
    offset = data.offset || null;
  } while (offset);
  return records.map(normalizeCalfRecord);
}

function parseSetJSON(v) {
  if (!v) return [];
  try { const p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch (e) { return []; }
}

function normalizeCalfRecord(r) {
  const f = r.fields;
  return {
    id: r.id,
    timestamp: f.Timestamp || '',
    date: f.Date || '',
    dayType: f.DayType || '',
    assist: f.RightAssist || '',
    assistAvg: f.RightAssistAvg ?? null,
    priorActivity: f.PriorActivity || '',
    soreness: f.Soreness || '',
    heelRaiseLeft:   parseSetJSON(f.HeelRaiseLeft_Sets),
    heelRaiseRight:  parseSetJSON(f.HeelRaiseRight_Sets),
    bigToeLeft:      parseSetJSON(f.BigToeLeft_Sets),
    bigToeRight:     parseSetJSON(f.BigToeRight_Sets),
    seatedCalfRaise: parseSetJSON(f.SeatedCalfRaise_Sets),
    isoHoldLeft:     parseSetJSON(f.IsoHoldLeft_Sets),
    isoHoldRight:    parseSetJSON(f.IsoHoldRight_Sets),
    bentKneeLeft:    parseSetJSON(f.BentKneeLeft_Sets),
    bentKneeRight:   parseSetJSON(f.BentKneeRight_Sets),
  };
}

function buildCalfFields(entry) {
  return {
    Timestamp: entry.timestamp,
    Date: entry.date,
    DayType: entry.dayType || null,
    // Airtable fields keep their legacy Right* names but hold the left-leg assist
    RightAssist: entry.assist || null,
    RightAssistAvg: entry.assistAvg ?? null,
    PriorActivity: entry.priorActivity || '',
    Soreness: entry.soreness || '',
    HeelRaiseLeft_Sets:   entry.heelRaiseLeft?.length   ? JSON.stringify(entry.heelRaiseLeft)   : null,
    HeelRaiseRight_Sets:  entry.heelRaiseRight?.length  ? JSON.stringify(entry.heelRaiseRight)  : null,
    BigToeLeft_Sets:      entry.bigToeLeft?.length      ? JSON.stringify(entry.bigToeLeft)      : null,
    BigToeRight_Sets:     entry.bigToeRight?.length     ? JSON.stringify(entry.bigToeRight)     : null,
    SeatedCalfRaise_Sets: entry.seatedCalfRaise?.length ? JSON.stringify(entry.seatedCalfRaise) : null,
    IsoHoldLeft_Sets:     entry.isoHoldLeft?.length     ? JSON.stringify(entry.isoHoldLeft)     : null,
    IsoHoldRight_Sets:    entry.isoHoldRight?.length    ? JSON.stringify(entry.isoHoldRight)    : null,
    BentKneeLeft_Sets:    entry.bentKneeLeft?.length    ? JSON.stringify(entry.bentKneeLeft)    : null,
    BentKneeRight_Sets:   entry.bentKneeRight?.length   ? JSON.stringify(entry.bentKneeRight)   : null,
  };
}

async function createCalfLog(entry) {

// ─── SYNC STATUS ──────────────────────────────────────────────────────────────
function setSync(status, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + status;
  document.getElementById('syncLabel').textContent = label;
  document.getElementById('refreshBtn').classList.toggle('spinning', status === 'syncing');
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ─── INIT ─────────────────────────────────────────────────────────────────────
let loadController = null;
// A write makes local state newer than any in-flight fetch, so drop that fetch.
function abortLoad() { loadController?.abort(); }

// background: resync triggered by focus/online — don't reset the calf form inputs.
async function load(background = false) {
  if (loadController) loadController.abort();
  const controller = new AbortController();
  loadController = controller;
  setSync('syncing', 'Syncing...');
  try {
    [logs, calfLogs] = await Promise.all([
      fetchAllLogs(controller.signal),
      fetchAllCalfLogs(controller.signal),
    ]);
    if (controller.signal.aborted) return;
    setSync('ok', 'Airtable ✓');
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
  } catch (e) {
    if (controller.signal.aborted) return;
    console.warn('Airtable unavailable, using cache:', e);
    setSync('err', 'Offline (cached)');
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      logs = JSON.parse(cached);
      // Entries cached before an exercise was added lack its key
      logs.forEach(l => EXERCISES.forEach(ex => { l[ex.key] ??= { variant: '', sets: null, reps: null }; }));
    }
    const calfCached = localStorage.getItem(CALF_CACHE_KEY);
    if (calfCached) calfLogs = JSON.parse(calfCached);
  } finally {
    if (loadController === controller) loadController = null;
  }

  // Pre-fill each exercise variant from its most recent log entry
  EXERCISES.forEach(ex => {
    const recent = logs.find(l => l[ex.key]?.variant);
    if (recent) state[ex.key].variant = recent[ex.key].variant;
  });

  renderCards();
  renderHistory();
  if (document.getElementById('viewCalf')?.classList.contains('active')) {
    if (!background) renderCalfForm();
    renderCalfWeek();
    renderCalfChart();
    renderCalfHistory();
  }

  const overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    overlay.classList.add('hidden');
    setTimeout(() => overlay.remove(), 400);
  }
}

// ─── VIEW SWITCHING ───────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view' + name).classList.add('active');
  document.getElementById('tab' + name).classList.add('active');
  if (name === 'Progress') renderProgress();
  if (name === 'Calf') { renderCalfForm(); renderCalfWeek(); renderCalfChart(); renderCalfHistory(); }
}

// ─── TARGET ───────────────────────────────────────────────────────────────────
function getLastSessionTarget(key) {
  const today = localDateKey(new Date());
  const pastDates = [...new Set(
    logs
      .filter(l => l.date !== today && l[key]?.sets != null && l[key]?.reps != null)
      .map(l => l.date)
  )].sort().reverse();

  if (!pastDates.length) return null;

  const lastDate = pastDates[0];
  const dayLogs = logs.filter(l => l.date === lastDate && l[key]?.sets != null && l[key]?.reps != null);
  const totalSets = dayLogs.reduce((sum, l) => sum + (l[key].sets || 1), 0);
  const repsPerSet = dayLogs[0]?.[key]?.reps;
  if (!repsPerSet) return null;

  return { sets: totalSets, repsPerSet };
}

// ─── LOG VIEW ─────────────────────────────────────────────────────────────────
function todaySetsFor(key) {
  const today = localDateKey(new Date());
  return logs.reduce((n, l) =>
    n + (l.date === today && l[key].sets != null && l[key].reps != null ? l[key].sets : 0), 0);
}

function lastEntry(key) {
  return logs.find(l => l[key].reps != null);
}

function restRemaining(key) {
  const entry = lastEntry(key);
  if (!entry || !entry.timestamp) return 0;
  return Math.max(0, READY_AFTER_MS - (Date.now() - new Date(entry.timestamp).getTime()));
}

function defaultReps(key) {
  return num(state[key].reps) || getLastSessionTarget(key)?.repsPerSet || lastEntry(key)?.[key].reps || 5;
}

function ringHtml(done, target) {
  const r = 17.25, c = 2 * Math.PI * r;
  const pct = target ? Math.min(1, done / target) : 0;
  const label = target ? `${done}/${target}` : done;
  return `<div class="ring"><svg viewBox="0 0 38 38">
      <circle class="ring-track" cx="19" cy="19" r="${r}"/>
      ${pct > 0 ? `<circle class="ring-fill${pct >= 1 ? ' complete' : ''}" cx="19" cy="19" r="${r}" stroke-dasharray="${c * pct} ${c}"/>` : ''}
    </svg><span>${label}</span></div>`;
}

function renderCards() {
  const container = document.getElementById('exerciseCards');
  let totalDone = 0, totalTarget = 0;

  const rows = EXERCISES.map(ex => {
    const done = todaySetsFor(ex.key);
    const target = getLastSessionTarget(ex.key);
    const rest = restRemaining(ex.key);
    if (target) { totalTarget += target.sets; totalDone += Math.min(done, target.sets); }
    const status = target && done >= target.sets ? 'done' : (rest > 0 ? 'rest' : 'ready');
    return { ex, done, target, rest, status };
  });

  const rowHtml = ({ ex, done, target, rest, status }) => {
    const v = state[ex.key].variant;
    if (status === 'done') {
      return `<button class="ex-row done" onclick="openLogSheet('${ex.key}')">
          <span class="ex-dot" style="background:${ex.color}"></span>
          <span class="ex-row-main"><span class="ex-row-name">${ex.label}</span></span>
          <span class="ex-row-sub">${h(v)} · ${done} sets</span>
          <span class="ex-row-check">✓</span>
        </button>`;
    }
    const sub = target ? `${h(v)} · ${target.sets} × ${target.repsPerSet}` : h(v);
    const stateHtml = status === 'ready'
      ? '<span class="ex-row-state ready">Ready</span>'
      : `<span class="ex-row-state">Rest ${Math.ceil(rest / 60000)}m</span>`;
    return `<button class="ex-row" onclick="openLogSheet('${ex.key}')">
        ${ringHtml(done, target?.sets)}
        <span class="ex-row-main"><span class="ex-row-name">${ex.label}</span><span class="ex-row-sub">${sub}</span></span>
        ${stateHtml}
        <span class="ex-row-chev">›</span>
      </button>`;
  };

  const order = { ready: 0, rest: 1, done: 2 };
  const upNext = rows.filter(r => r.status !== 'done').sort((a, b) => order[a.status] - order[b.status]);
  const done = rows.filter(r => r.status === 'done');
  container.innerHTML =
    (upNext.length ? `<div class="section-lbl ex-group-lbl">Up next</div>${upNext.map(rowHtml).join('')}` : '') +
    (done.length ? `<div class="section-lbl ex-group-lbl">Done</div>${done.map(rowHtml).join('')}` : '');

  const setsToday = rows.reduce((n, r) => n + r.done, 0);
  document.getElementById('logSummaryNum').innerHTML = totalTarget
    ? `${totalDone}<small>/${totalTarget}</small>` : `${setsToday}`;
  const bar = document.getElementById('logSummaryBar');
  bar.style.width = totalTarget ? `${Math.round(totalDone / totalTarget * 100)}%` : '0%';
  bar.classList.toggle('complete', totalTarget > 0 && totalDone >= totalTarget);

  if (sheetKey) renderLogSheet();
}

// ─── LOG SHEET ────────────────────────────────────────────────────────────────
let sheetKey = null;

function openLogSheet(key) {
  sheetKey = key;
  state[key].reps = String(defaultReps(key));
  renderLogSheet();
  document.getElementById('logSheetWrap').classList.add('sheet-open');
  document.getElementById('sheetLogBtn').focus({ preventScroll: true });
}

function closeLogSheet() {
  sheetKey = null;
  document.getElementById('logSheetWrap').classList.remove('sheet-open');
}

function renderLogSheet() {
  const key = sheetKey;
  const ex = EXERCISES.find(e => e.key === key);
  const s = state[key];
  const done = todaySetsFor(key);
  const target = getLastSessionTarget(key);
  const reps = num(s.reps);

  document.getElementById('sheetTitle').textContent = ex.label;
  const parts = [];
  if (target) parts.push(done < target.sets ? `Set ${done + 1} of ${target.sets}` : `${done} of ${target.sets} sets done`);
  else if (done) parts.push(`${done} set${done !== 1 ? 's' : ''} today`);
  const last = lastEntry(key);
  if (last) parts.push(`last ${last[key].reps} reps, ${timeSinceLastSet(key)}`);
  document.getElementById('sheetSub').textContent = parts.join(' · ');

  document.getElementById('sheetDots').innerHTML = target
    ? Array.from({ length: Math.max(target.sets, done) }, (_, i) => `<i class="${i < done ? 'filled' : ''}"></i>`).join('')
    : '';
  document.getElementById('sheetVariants').innerHTML = ex.variants.map(v =>
    `<button class="pill${s.variant === v ? ' active' : ''}" onclick="setVariant('${key}','${esc(v)}')">${h(v)}</button>`
  ).join('');
  document.getElementById('sheetReps').textContent = reps;

  const start = Math.max(1, reps - 2);
  document.getElementById('sheetQuick').innerHTML = [0, 1, 2, 3, 4].map(i => start + i).map(n =>
    `<button class="${n === reps ? 'active' : ''}" onclick="setReps(${n})">${n}</button>`
  ).join('');
}

function setReps(n) {
  state[sheetKey].reps = String(Math.max(1, n));
  renderLogSheet();
}

function stepReps(d) {
  setReps(num(state[sheetKey].reps) + d);
}

function setVariant(key, variant) {
  state[key].variant = variant;
  renderCards();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetKey) closeLogSheet();
});

// Keep rest countdowns current while the Log tab is open
setInterval(() => {
  if (document.getElementById('viewLog').classList.contains('active')) renderCards();
}, 30000);

// ─── LOG EXERCISE ─────────────────────────────────────────────────────────────
async function logExercise(key) {
  const s = state[key];
  const reps = num(s.reps);
  if (!reps) return;

  abortLoad();
  const btn = document.getElementById('sheetLogBtn');
  btn.disabled = true;
  btn.textContent = '...';
  setSync('syncing', 'Saving...');

  const now = new Date();
  const log = {
    timestamp: now.toISOString(),
    date: localDateKey(now),
    notes: '',
  };
  EXERCISES.forEach(ex => { log[ex.key] = { variant: '', sets: null, reps: null }; });
  log[key] = { variant: s.variant, sets: num(s.sets) || 1, reps: reps };

  try {
    log.id = await createLog(log);
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    log.id = localId();
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('err', 'Saved locally');
    alert('Airtable unavailable — kept locally.\n\n' + e.message);
  }

  renderCards();
  renderHistory();

  // Keep reps and variant so the next set is one tap
  btn.textContent = '✓';
  btn.style.background = 'var(--green)';
  setTimeout(() => {
    closeLogSheet();
    btn.disabled = false;
    btn.textContent = 'LOG SET';
    btn.style.background = '';
  }, 700);
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
async function deleteEntry(key) {
  const log = logs.find(l => logKey(l) === key);
  if (!log || !confirm('Delete this entry?')) return;
  abortLoad();
  setSync('syncing', 'Deleting...');
  try {
    if (log.id && !log.id.startsWith('local-')) await deleteLog(log.id);
    logs = logs.filter(l => logKey(l) !== key);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Deleted');
    renderHistory();
    renderCards();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

// ─── HISTORY RENDER ───────────────────────────────────────────────────────────
function renderHistory() {
  const list = document.getElementById('historyList');
  if (logs.length === 0) {
    list.innerHTML = '<div class="empty"><strong>NO LOGS YET</strong>Log your first set above.</div>';
    return;
  }

  // Group records by date
  const dateOrder = [];
  const byDate = {};
  logs.slice(0, 120).forEach(log => {
    if (!byDate[log.date]) {
      byDate[log.date] = { exercises: {}, records: [] };
      dateOrder.push(log.date);
    }
    byDate[log.date].records.push(log);

    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && !d.variant) return;
      if (!byDate[log.date].exercises[ex.key]) {
        byDate[log.date].exercises[ex.key] = { totalSets: 0, totalReps: 0, variant: '' };
      }
      const g = byDate[log.date].exercises[ex.key];
      if (d.sets != null) g.totalSets += d.sets;
      if (d.sets != null && d.reps != null) g.totalReps += d.sets * d.reps;
      if (d.variant) g.variant = d.variant;
    });
  });

  list.innerHTML = dateOrder.map(date => {
    const entry = byDate[date];

    const exRows = EXERCISES.map(ex => {
      const g = entry.exercises[ex.key];
      if (!g) return '';
      const vol = g.totalReps > 0
        ? `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''} · ${g.totalReps} reps`
        : `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''}`;
      return `<div class="hist-ex">
        <span class="hist-ex-name">${ex.label}</span>
        <span class="hist-ex-vol">${vol}</span>
        <span class="hist-ex-var">${h(g.variant)}</span>
      </div>`;
    }).filter(Boolean).join('');

    const recordRows = entry.records.map(log => {
      const key = logKey(log);
      const parts = EXERCISES
        .filter(ex => log[ex.key].sets != null)
        .map(ex => {
          const d = log[ex.key];
          return `${ex.label} ${d.sets}×${d.reps}`;
        });
      const desc = parts.join(' · ') || '—';
      return `<div class="hist-record">
        <span>${h(desc)}</span>
        <button class="hist-del" onclick="deleteEntry('${key}')" title="Delete">×</button>
      </div>`;
    }).join('');

    return `<div class="hist-item">
      <div class="hist-head">
        <span class="hist-date">${fmtDate(date)}</span>
        <span class="hist-dow">${fmtDow(date)}</span>
      </div>
      <div class="hist-exercises">
        ${exRows || '<span style="color:var(--muted);font-size:12px">Nothing logged</span>'}
      </div>
      <div class="hist-records">${recordRows}</div>
    </div>`;
  }).join('');
}

// ─── VARIANT COLORS (Progress charts) ─────────────────────────────────────────
// Keyed by a variant's position within its exercise's own `variants` array —
// identity only, not a difficulty ordering (e.g. pushup's array isn't a strict ladder).
const VARIANT_PALETTE = ['#5b8def', '#e8a020', '#3ab06a', '#d63a2f', '#a35bef', '#2fb8c4'];
const VARIANT_MISSED_COLOR = '#45454c';

function variantColor(ex, variant) {
  if (!variant) return VARIANT_MISSED_COLOR;
  const idx = ex.variants.indexOf(variant);
  return VARIANT_PALETTE[(idx < 0 ? 0 : idx) % VARIANT_PALETTE.length];
}

// Per-day totals for `ex` with from <= date <= to: sum sets×reps across all records per day
function dailySessions(ex, from, to) {
  const byDate = {};
  logs
    .filter(l => l.date >= from && l.date <= to && l[ex.key].sets != null && l[ex.key].reps != null)
    .forEach(l => {
      const d = l.date;
      if (!byDate[d]) byDate[d] = { date: d, total: 0, sets: 0, maxReps: 0, mixed: false, variant: l[ex.key].variant };
      if (byDate[d].sets && byDate[d].maxReps !== l[ex.key].reps) byDate[d].mixed = true;
      byDate[d].total += l[ex.key].sets * l[ex.key].reps;
      byDate[d].sets += l[ex.key].sets;
      byDate[d].maxReps = Math.max(byDate[d].maxReps, l[ex.key].reps);
      byDate[d].variant = l[ex.key].variant; // use most recent variant for label
    });
  return byDate;
}

function fmtScheme(p) {
  return p.mixed ? `${p.sets} sets · best ${p.maxReps}` : `${p.sets}×${p.maxReps}`;
}

// Shades each run of same-variant sessions and labels it at the top
const variantBandsPlugin = {
  id: 'variantBands',
  beforeDatasetsDraw(chart, _args, opts) {
    const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
    const runs = opts.runs;
    ctx.save();
    runs.forEach((run, i) => {
      const x0 = i === 0 ? left : (x.getPixelForValue(runs[i - 1].end) + x.getPixelForValue(run.start)) / 2;
      const x1 = i === runs.length - 1 ? right : (x.getPixelForValue(run.end) + x.getPixelForValue(runs[i + 1].start)) / 2;
      ctx.fillStyle = run.color + '14';
      ctx.fillRect(x0, top, x1 - x0, bottom - top);
      ctx.font = '700 9px "Instrument Sans", sans-serif';
      const label = run.variant.toUpperCase();
      if (ctx.measureText(label).width + 12 <= x1 - x0) {
        ctx.fillStyle = run.color;
        ctx.fillText(label, x0 + 6, top + 12);
      }
    });
    ctx.restore();
  },
};

function renderFocus() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};

  const ex = EXERCISES.find(e => e.key === progressEx) || EXERCISES[0];
  const body = document.getElementById('progressBody');

  const todayDate = new Date();
  const today = localDateKey(todayDate);
  let cutoffDate;
  if (chartRange === 'all') {
    const earliest = logs.reduce((min, l) => (l.date && (!min || l.date < min)) ? l.date : min, null);
    cutoffDate = earliest ? new Date(earliest + 'T00:00:00') : addDays(todayDate, -30);
  } else {
    const days = { '1w': 7, '1m': 30, '3m': 90 }[chartRange] || 30;
    cutoffDate = addDays(todayDate, -(days - 1));
  }
  const cutoff = localDateKey(cutoffDate);

  const byDate = dailySessions(ex, cutoff, today);
  const sessions = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));

  if (!sessions.length) {
    body.innerHTML = `
      <div class="focus-head"><div class="focus-lbl">${ex.label} · best reps per set</div></div>
      <div class="chart-empty">No ${ex.label.toLowerCase()} logged in this range</div>`;
    return;
  }

  // Every day in range, so the x axis is time-true; missed days are gaps the line spans
  const days = [];
  for (let d = new Date(cutoffDate); d <= todayDate; d = addDays(d, 1)) days.push(localDateKey(d));
  const pts = days.map(ds => byDate[ds] || null);

  // Runs of consecutive sessions on the same variant
  const runs = [];
  pts.forEach((p, i) => {
    if (!p) return;
    const last = runs[runs.length - 1];
    if (last && last.variant === p.variant) last.end = i;
    else runs.push({ variant: p.variant, color: variantColor(ex, p.variant), start: i, end: i });
  });

  const latest = sessions[sessions.length - 1];
  const current = runs[runs.length - 1];
  const runStart = pts[current.start];
  const delta = latest.maxReps - runStart.maxReps;
  const deltaWhen = runs.length > 1 ? 'since switching'
    : { '1w': 'this week', '1m': 'this month', '3m': 'in 3 months', all: 'all time' }[chartRange];
  const deltaText = delta === 0 ? `No change ${deltaWhen}` : `${delta > 0 ? '▲' : '▼'} ${Math.abs(delta)} ${deltaWhen}`;

  const onVariant = sessions.filter(s => s.variant === latest.variant);
  const best = onVariant.reduce((b, s) => s.maxReps >= b.maxReps ? s : b, onVariant[0]);

  const volume = sessions.reduce((sum, s) => sum + s.total, 0);
  let volumeSub = 'all time';
  if (chartRange !== 'all') {
    const prior = Object.values(dailySessions(ex, localDateKey(addDays(cutoffDate, -days.length)), localDateKey(addDays(cutoffDate, -1))))
      .reduce((sum, s) => sum + s.total, 0);
    volumeSub = prior ? `${volume >= prior ? '▲' : '▼'} ${Math.abs(Math.round((volume - prior) / prior * 100))}% vs prior` : 'no prior data';
  }

  body.innerHTML = `
    <div class="focus-head">
      <div>
        <div class="focus-lbl">${ex.label} · best reps per set</div>
        <div class="focus-val"><b>${latest.maxReps}</b><span style="color:${variantColor(ex, latest.variant)}">${h(latest.variant)}</span></div>
      </div>
      <span class="focus-delta ${delta > 0 ? 'up' : delta < 0 ? 'down' : ''}">${deltaText}</span>
    </div>
    <div class="focus-chart"><canvas id="focusChart"></canvas></div>
    <div class="focus-lbl">Total reps per session</div>
    <div class="focus-bars"><canvas id="focusBars"></canvas></div>
    <div class="kpis">
      <div class="kpi"><span class="focus-lbl">Best set</span><b>${best.mixed ? best.maxReps : `${best.sets}×${best.maxReps}`}</b><span>${h(best.variant)} · ${fmtDate(best.date)}</span></div>
      <div class="kpi"><span class="focus-lbl">Volume</span><b>${volume}</b><span>${volumeSub}</span></div>
      <div class="kpi"><span class="focus-lbl">Sessions</span><b>${sessions.length}</b><span>of ${days.length} days</span></div>
    </div>`;

  const labels = days.map(fmtDate);
  const lastIdx = pts.length - 1 - [...pts].reverse().findIndex(Boolean);
  const dense = pts.length > 45;
  const fixedYWidth = scale => { scale.width = 28; };
  const tooltip = {
    backgroundColor: '#141416',
    borderColor: '#2a2a30',
    borderWidth: 1,
    titleColor: '#e8e6e0',
    bodyColor: '#9b98a0',
    displayColors: false,
  };

  charts.focus = new Chart(document.getElementById('focusChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: pts.map(p => p ? p.maxReps : null),
        spanGaps: true,
        borderWidth: 2.2,
        tension: 0.25,
        pointBackgroundColor: pts.map(p => p ? variantColor(ex, p.variant) : 'transparent'),
        pointBorderColor: pts.map((p, i) => i === lastIdx ? '#0c0c0e' : p ? variantColor(ex, p.variant) : 'transparent'),
        pointBorderWidth: pts.map((_, i) => i === lastIdx ? 2 : 1),
        pointRadius: pts.map((p, i) => i === lastIdx ? 5 : p && !dense ? 3 : 0),
        pointHoverRadius: 6,
        segment: {
          // A variant switch is drawn as a muted dashed connector: the drop is the harder variant, not regression
          borderColor: c => pts[c.p0DataIndex].variant === pts[c.p1DataIndex].variant
            ? variantColor(ex, pts[c.p1DataIndex].variant) : VARIANT_MISSED_COLOR,
          borderDash: c => pts[c.p0DataIndex].variant === pts[c.p1DataIndex].variant ? undefined : [3, 3],
        },
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        variantBands: { runs },
        tooltip: {
          ...tooltip,
          callbacks: {
            label: item => {
              const p = pts[item.dataIndex];
              return `${fmtScheme(p)} · ${p.total} total · ${p.variant}`;
            },
          },
        },
      },
      scales: {
        x: {
          offset: true,
          ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 4, maxRotation: 0 },
          grid: { display: false },
        },
        y: {
          min: 0,
          suggestedMax: Math.max(...sessions.map(s => s.maxReps)) + 1,
          afterFit: fixedYWidth,
          ticks: { color: '#6b6870', font: { size: 10 }, precision: 0, maxTicksLimit: 5 },
          grid: { color: '#1c1c20' },
          border: { display: false },
        },
      },
    },
    plugins: [variantBandsPlugin],
  });

  charts.bars = new Chart(document.getElementById('focusBars'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: pts.map(p => p ? p.total : null),
        backgroundColor: pts.map(p => p ? variantColor(ex, p.variant) + 'b3' : 'transparent'),
        borderRadius: 2,
        maxBarThickness: 8,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltip, callbacks: { label: item => `${pts[item.dataIndex].total} total reps` } },
      },
      scales: {
        x: { offset: true, display: false },
        y: { min: 0, afterFit: fixedYWidth, ticks: { display: false }, grid: { display: false }, border: { display: false } },
      },
    },
  });
}

// ─── CALF RENDER ──────────────────────────────────────────────────────────────
function renderCalfForm() {
  const dateInput = document.getElementById('calfDate');
  if (!dateInput.value) dateInput.value = localDateKey(new Date());
  updateCalfDayTypeUI(dateInput.value);
}

function onCalfDateChange() {
  updateCalfDayTypeUI(document.getElementById('calfDate').value);
}

function updateCalfDayTypeUI(dateStr) {
  const type = calfDayType(dateStr); // 'A' | 'B' | 'Off'
  const block = calfBlock(dateStr);
  const badge = document.getElementById('calfDayTypeBadge');
  const d = new Date(dateStr + 'T12:00:00');
  const dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  badge.textContent = `${dow} · ${CALF_DAYTYPE_LABEL[type]} · Block ${block}`;
  badge.className = 'calf-daytype-badge ' + (type === 'A' ? 'a-day' : type === 'B' ? 'b-day' : 'off');

  calfPull = usesPull(dateStr);
  resetCalfSetsState(type, block);
  loadCalfSetsFromExisting(dateStr);
  renderCalfExerciseSections(type, block);

  const existing = calfLogs.find(l => l.date === dateStr);
  document.getElementById('calfPriorActivity').value = existing?.priorActivity || '';
  document.getElementById('calfSoreness').value = existing?.soreness || '';
}

function loadCalfSetsFromExisting(dateStr) {
  const existing = calfLogs.find(l => l.date === dateStr);
  if (!existing) return;
  const lastAssist = (calfLogs.find(l => l.assist) || {}).assist || 'Moderate';

  if (existing.heelRaiseLeft?.length) calfSetsState.heelRaise.left = existing.heelRaiseLeft.map(s => calfPull
    ? { reps: String(s.reps), pull: s.pull || lastCalfPull('heelRaiseLeft') }
    : { reps: String(s.reps), assist: s.assist || lastAssist });
  if (existing.heelRaiseRight?.length) calfSetsState.heelRaise.right = existing.heelRaiseRight.map(s => ({ reps: String(s.reps) }));
  if (existing.bigToeLeft?.length) calfSetsState.bigToe.left = existing.bigToeLeft.map(s => ({ seconds: String(s.seconds) }));
  if (existing.bigToeRight?.length) calfSetsState.bigToe.right = existing.bigToeRight.map(s => ({ seconds: String(s.seconds) }));
  if (existing.seatedCalfRaise?.length) calfSetsState.seated = existing.seatedCalfRaise.map(s => ({ reps: String(s.reps), weight: String(s.weight) }));
  ['left', 'right'].forEach(side => {
    const iso = side === 'left' ? existing.isoHoldLeft : existing.isoHoldRight;
    const bk  = side === 'left' ? existing.bentKneeLeft : existing.bentKneeRight;
    if (iso?.length) calfSetsState.isoHold[side] = iso.map(s => calfPull
      ? { seconds: String(s.seconds), pull: s.pull || lastCalfPull(isoKey(side)) }
      : { seconds: String(s.seconds), grip: s.grip || GRIP_LEVELS[0] });
    if (bk?.length) calfSetsState.bentKnee[side] = bk.map(s => ({ reps: String(s.reps), weight: String(s.weight) }));
  });
}

const isoKey = side => side === 'left' ? 'isoHoldLeft' : 'isoHoldRight';

// Last logged value of `prop` in the sets stored under `setsKey`
function lastCalfSetValue(setsKey, prop) {
  const recent = calfLogs.find(l => (l[setsKey] || []).some(s => s[prop]));
  return recent ? recent[setsKey].filter(s => s[prop]).pop()[prop] : null;
}

function lastCalfGrip(side) {
  return lastCalfSetValue(isoKey(side), 'grip') || GRIP_LEVELS[0];
}

function lastCalfPull(setsKey) {
  return lastCalfSetValue(setsKey, 'pull') || 'Moderate';
}

function lastBentKneeWeight() {
  const recent = calfLogs.find(l => (l.bentKneeLeft || []).length);
  return recent ? recent.bentKneeLeft[recent.bentKneeLeft.length - 1].weight : 10;
}

function resetCalfSetsState(type, block) {
  const lastAssist = (calfLogs.find(l => l.assist) || {}).assist || 'Moderate';
  const recentB = calfLogs.find(l => (l.seatedCalfRaise || []).length);
  const lastWeight = recentB ? recentB.seatedCalfRaise[recentB.seatedCalfRaise.length - 1].weight : 10;
  const rows = (n, make) => Array.from({ length: n }, make);

  calfSetsState.heelRaise.left = []; calfSetsState.heelRaise.right = [];
  calfSetsState.bigToe.left = []; calfSetsState.bigToe.right = [];
  calfSetsState.seated = [];
  calfSetsState.isoHold.left = []; calfSetsState.isoHold.right = [];
  calfSetsState.bentKnee.left = []; calfSetsState.bentKnee.right = [];

  if (block === 1) {
    if (type === 'A') {
      calfSetsState.heelRaise.left  = rows(3, () => ({ reps: '', assist: lastAssist }));
      calfSetsState.heelRaise.right = rows(2, () => ({ reps: '' }));
      calfSetsState.bigToe.left     = rows(3, () => ({ seconds: '30' }));
      calfSetsState.bigToe.right    = rows(3, () => ({ seconds: '30' }));
    } else if (type === 'B') {
      calfSetsState.seated = rows(2, () => ({ reps: '', weight: String(lastWeight) }));
    }
  } else if (type === 'A') {
    calfSetsState.heelRaise.right = rows(2, () => ({ reps: '' }));
    if (calfPull) {
      calfSetsState.heelRaise.left = rows(5, () => ({ reps: '', pull: lastCalfPull('heelRaiseLeft') }));
      calfSetsState.isoHold.left   = rows(3, () => ({ seconds: '', pull: lastCalfPull('isoHoldLeft') }));
      calfSetsState.isoHold.right  = rows(2, () => ({ seconds: '', pull: lastCalfPull('isoHoldRight') }));
    } else {
      calfSetsState.heelRaise.left = rows(5, () => ({ reps: '', assist: lastAssist }));
      calfSetsState.isoHold.left   = rows(3, () => ({ seconds: '', grip: lastCalfGrip('left') }));
      calfSetsState.isoHold.right  = rows(2, () => ({ seconds: '', grip: lastCalfGrip('right') }));
    }
  } else if (type === 'B') {
    const w = String(lastBentKneeWeight());
    calfSetsState.bentKnee.left  = rows(2, () => ({ reps: '15', weight: w }));
    calfSetsState.bentKnee.right = rows(2, () => ({ reps: '15', weight: w }));
  }
}

function calfSidedBlock(title, exercise) {
  return `
      <div class="calf-ex-block">
        <div class="calf-ex-title">${title}</div>
        <div class="calf-ex-side-lbl">Left</div>
        <div id="calfRows-${exercise}-left"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('${exercise}','left')">+ Add set</button>
        <div class="calf-ex-side-lbl">Right</div>
        <div id="calfRows-${exercise}-right"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('${exercise}','right')">+ Add set</button>
      </div>`;
}

function renderCalfExerciseSections(type, block) {
  const wrap = document.getElementById('calfExerciseSections');
  let sided = [];
  if (type === 'A' && block === 1) {
    wrap.innerHTML = calfSidedBlock('Two-up, one-down heel raise', 'heelRaise') + calfSidedBlock('Big-toe press', 'bigToe');
    sided = ['heelRaise', 'bigToe'];
  } else if (type === 'A') {
    wrap.innerHTML = calfSidedBlock(`Two-up, one-down heel raise · ${calfPull ? 'doorframe pull' : 'clean reps'}`, 'heelRaise') +
      calfSidedBlock('Mid-height iso hold · doorframe, 30s cap', 'isoHold');
    sided = ['heelRaise', 'isoHold'];
  } else if (type === 'B' && block === 1) {
    wrap.innerHTML = `
      <div class="calf-ex-block">
        <div class="calf-ex-title">Seated calf raise</div>
        <div id="calfRows-seated"></div>
        <button class="pill add-set-btn" onclick="addCalfSet('seated')">+ Add set</button>
      </div>`;
    renderSetRows('seated');
  } else if (type === 'B') {
    wrap.innerHTML = calfSidedBlock('Bent-knee heel raise', 'bentKnee');
    sided = ['bentKnee'];
  } else {
    wrap.innerHTML = `<div class="calf-off-note">Off day — nothing scheduled.</div>`;
  }
  sided.forEach(ex => { renderSetRows(ex, 'left'); renderSetRows(ex, 'right'); });
}

function pullPills(exercise, side, idx, row, levels) {
  return `
        <div class="variant-pills set-row-assist">
          ${levels.map(v => `<button class="pill${row.pull === v ? ' active' : ''}" onclick="setCalfSetPull('${exercise}','${side}',${idx},'${esc(v)}')">${h(v)}</button>`).join('')}
        </div>`;
}

function renderSetRows(exercise, side) {
  const containerId = side ? `calfRows-${exercise}-${side}` : `calfRows-${exercise}`;
  const container = document.getElementById(containerId);
  if (!container) return;
  const rows = exercise === 'seated' ? calfSetsState.seated : calfSetsState[exercise][side];

  container.innerHTML = rows.map((row, idx) => {
    const removeBtn = `<button class="set-remove" onclick="removeCalfSet('${exercise}','${side || ''}',${idx})" title="Remove set">×</button>`;

    if (exercise === 'heelRaise') {
      const assistPills = side !== 'left' ? '' : calfPull ? pullPills('heelRaise', side, idx, row, HEEL_PULL_LEVELS) : `
        <div class="variant-pills set-row-assist">
          ${ASSIST_LEVELS.map(v => `<button class="pill${row.assist === v ? ' active' : ''}" onclick="setCalfSetAssist(${idx},'${esc(v)}')">${h(v)}</button>`).join('')}
        </div>`;
      return `
        <div class="set-row">
          <div class="input-group">
            <span class="input-lbl">Set ${idx + 1} reps</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.reps)}"
              oninput="calfSetsState.heelRaise.${side}[${idx}].reps=this.value">
          </div>
          ${removeBtn}
          ${assistPills}
        </div>`;
    }

    if (exercise === 'bigToe') {
      return `
        <div class="set-row">
          <div class="input-group">
            <span class="input-lbl">Set ${idx + 1} seconds</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.seconds)}"
              oninput="calfSetsState.bigToe.${side}[${idx}].seconds=this.value">
          </div>
          ${removeBtn}
        </div>`;
    }

    if (exercise === 'isoHold') {
      return `
        <div class="set-row">
          <div class="input-group">
            <span class="input-lbl">Hold ${idx + 1} seconds</span>
            <input class="num-input" type="number" inputmode="numeric" min="0" max="30" placeholder="—" value="${h(row.seconds)}"
              oninput="calfSetsState.isoHold.${side}[${idx}].seconds=this.value">
          </div>
          ${removeBtn}
          ${calfPull ? pullPills('isoHold', side, idx, row, ISO_PULL_LEVELS) : `
          <div class="variant-pills set-row-assist">
            ${GRIP_LEVELS.map(v => `<button class="pill${row.grip === v ? ' active' : ''}" onclick="setCalfSetGrip('${side}',${idx},'${esc(v)}')">${h(v)}</button>`).join('')}
          </div>`}
        </div>`;
    }

    const stateRef = exercise === 'seated' ? `calfSetsState.seated[${idx}]` : `calfSetsState.${exercise}.${side}[${idx}]`;
    return `
      <div class="set-row">
        <div class="input-group">
          <span class="input-lbl">Set ${idx + 1} reps</span>
          <input class="num-input" type="number" inputmode="numeric" min="0" placeholder="—" value="${h(row.reps)}"
            oninput="${stateRef}.reps=this.value">
        </div>
        <div class="input-group">
          <span class="input-lbl">Weight kg</span>
          <input class="num-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="—" value="${h(row.weight)}"
            oninput="${stateRef}.weight=this.value">
        </div>
        ${removeBtn}
      </div>`;
  }).join('');
}

function addCalfSet(exercise, side) {
  if (exercise === 'seated') {
    const last = calfSetsState.seated[calfSetsState.seated.length - 1];
    calfSetsState.seated.push({ reps: '', weight: last ? last.weight : '10' });
    renderSetRows('seated');
    return;
  }
  const rows = calfSetsState[exercise][side];
  const last = rows[rows.length - 1];
  if (exercise === 'heelRaise') rows.push(side !== 'left' ? { reps: '' }
    : calfPull ? { reps: '', pull: last?.pull || lastCalfPull('heelRaiseLeft') }
    : { reps: '', assist: last?.assist || 'Moderate' });
  else if (exercise === 'bigToe') rows.push({ seconds: '30' });
  else if (exercise === 'isoHold') rows.push(calfPull
    ? { seconds: '', pull: last?.pull || lastCalfPull(isoKey(side)) }
    : { seconds: '', grip: last?.grip || lastCalfGrip(side) });
  else if (exercise === 'bentKnee') rows.push({ reps: '15', weight: last ? last.weight : '10' });
  renderSetRows(exercise, side);
}

function removeCalfSet(exercise, side, idx) {
  if (exercise === 'seated') {
    calfSetsState.seated.splice(idx, 1);
    renderSetRows('seated');
  } else {
    calfSetsState[exercise][side].splice(idx, 1);
    renderSetRows(exercise, side);
  }
}

function setCalfSetAssist(idx, level) {
  calfSetsState.heelRaise.left[idx].assist = level;
  renderSetRows('heelRaise', 'left');
}

function setCalfSetPull(exercise, side, idx, level) {
  calfSetsState[exercise][side][idx].pull = level;
  renderSetRows(exercise, side);
}

function setCalfSetGrip(side, idx, level) {
  calfSetsState.isoHold[side][idx].grip = level;
  renderSetRows('isoHold', side);
}

async function logCalfEntry() {
  const dateStr = document.getElementById('calfDate').value || localDateKey(new Date());
  const type = calfDayType(dateStr);
  const block = calfBlock(dateStr);
  const isA = type === 'A', isB = type === 'B';
  const b1 = block === 1, b2 = block === 2;
  const repsWeight = rows => rows.map(r => ({ reps: num(r.reps), weight: num(r.weight) })).filter(r => r.reps != null);
  const pull = usesPull(dateStr);
  const holds = rows => rows.map(r => pull ? { seconds: num(r.seconds), pull: r.pull || null } : { seconds: num(r.seconds), grip: r.grip || null }).filter(r => r.seconds != null);

  const heelRaiseLeft   = isA ? calfSetsState.heelRaise.left.map(r => pull ? { reps: num(r.reps), pull: r.pull || null } : { reps: num(r.reps), assist: r.assist || null }).filter(r => r.reps != null) : [];
  const heelRaiseRight  = isA ? calfSetsState.heelRaise.right.map(r => ({ reps: num(r.reps) })).filter(r => r.reps != null) : [];
  const bigToeLeft      = isA && b1 ? calfSetsState.bigToe.left.map(r => ({ seconds: num(r.seconds) })).filter(r => r.seconds != null) : [];
  const bigToeRight     = isA && b1 ? calfSetsState.bigToe.right.map(r => ({ seconds: num(r.seconds) })).filter(r => r.seconds != null) : [];
  const seatedCalfRaise = isB && b1 ? repsWeight(calfSetsState.seated) : [];
  const isoHoldLeft     = isA && b2 ? holds(calfSetsState.isoHold.left) : [];
  const isoHoldRight    = isA && b2 ? holds(calfSetsState.isoHold.right) : [];
  const bentKneeLeft    = isB && b2 ? repsWeight(calfSetsState.bentKnee.left) : [];
  const bentKneeRight   = isB && b2 ? repsWeight(calfSetsState.bentKnee.right) : [];

  const assistVals = heelRaiseLeft.map(s => ASSIST_VALUE[s.assist]).filter(Boolean);
  const assistAvg = assistVals.length ? assistVals.reduce((a, b) => a + b, 0) / assistVals.length : null;
  const assist = assistAvg ? ASSIST_LEVELS[Math.round(assistAvg) - 1] : '';

  const existing = calfLogs.find(l => l.date === dateStr);

  const entry = {
    timestamp: existing ? existing.timestamp : new Date().toISOString(),
    date: dateStr,
    dayType: CALF_DAYTYPE_LABEL[type],
    assist,
    assistAvg,
    heelRaiseLeft, heelRaiseRight, bigToeLeft, bigToeRight, seatedCalfRaise,
    isoHoldLeft, isoHoldRight, bentKneeLeft, bentKneeRight,
    priorActivity: document.getElementById('calfPriorActivity').value.trim(),
    soreness: document.getElementById('calfSoreness').value.trim(),
  };

  abortLoad();
  const btn = document.getElementById('calfLogBtn');
  btn.disabled = true;
  btn.textContent = '...';
  setSync('syncing', 'Saving...');

  try {
    if (existing && !existing.id.startsWith('local-')) {
      entry.id = existing.id;
      await updateCalfLog(entry);
      calfLogs = calfLogs.filter(l => l.id !== existing.id);
    } else if (existing) {
      calfLogs = calfLogs.filter(l => l.id !== existing.id);
      entry.id = await createCalfLog(entry);
    } else {
      entry.id = await createCalfLog(entry);
    }
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    if (!entry.id) entry.id = existing ? existing.id : localId();
    calfLogs = calfLogs.filter(l => l.id !== entry.id);
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('err', 'Saved locally');
    alert('Airtable unavailable — kept locally.\n\n' + e.message);
  }

  btn.disabled = false;
  btn.textContent = 'LOG';

  renderCalfWeek();
  renderCalfChart();
  renderCalfHistory();
}

async function deleteCalfEntry(id) {
  if (!confirm('Delete this entry?')) return;
  abortLoad();
  setSync('syncing', 'Deleting...');
  try {
    if (id && !id.startsWith('local-')) await deleteCalfLog(id);
    calfLogs = calfLogs.filter(l => l.id !== id);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Deleted');
    renderCalfWeek();
    renderCalfChart();
    renderCalfHistory();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

function renderCalfWeek() {
  const strip = document.getElementById('calfWeekStrip');
  strip.innerHTML = '';
  const today = new Date();
  const todayKey = localDateKey(today);
  const dow = today.getDay(); // 0=Sun..6=Sat
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = addDays(today, mondayOffset);

  const loggedDates = new Set(calfLogs.map(l => l.date));
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  for (let i = 0; i < 7; i++) {
    const d = addDays(monday, i);
    const ds = localDateKey(d);
    const type = calfDayType(ds); // 'A'|'B'|'Off'
    const isFuture = ds > todayKey;
    const isLogged = loggedDates.has(ds);

    const wrap = document.createElement('div'); wrap.className = 'week-day';
    const dot = document.createElement('div');
    dot.className = 'week-dot' +
      (type === 'Off' ? ' off-day' : '') +
      (isLogged ? ' trained' : (isFuture ? ' future' : ''));
    const lbl = document.createElement('div'); lbl.className = 'week-dot-lbl';
    lbl.textContent = `${labels[i]} · ${type}`;
    wrap.appendChild(dot); wrap.appendChild(lbl); strip.appendChild(wrap);
  }
}

function renderCalfChart() {
  if (calfCharts.trend) { calfCharts.trend.destroy(); delete calfCharts.trend; }

  const isoEntries = calfLogs
    .filter(l => (l.isoHoldLeft || []).length || (l.isoHoldRight || []).length)
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));

  const block = document.getElementById('calfChartBlock');
  if (isoEntries.length === 0) {
    block.innerHTML = '<div class="chart-empty">No iso hold entries yet</div>';
    return;
  }
  if (!document.getElementById('calfChart')) {
    block.innerHTML = '<div class="chart-wrap"><canvas id="calfChart"></canvas></div>';
  }

  // Fill every scheduled A-day between first entry and today so missed A-days show as gaps
  const first = new Date(isoEntries[0].date + 'T00:00:00');
  const last = new Date();
  const byDate = {};
  isoEntries.forEach(e => { byDate[e.date] = e; });
  const best = arr => arr.length ? Math.max(...arr.map(s => s.seconds)) : null;

  const pts = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    const ds = localDateKey(d);
    if (calfDayType(ds) !== 'A') continue;
    const e = byDate[ds];
    const left = e?.isoHoldLeft || [], right = e?.isoHoldRight || [];
    pts.push({ date: ds, logged: !!e, left, right, bestLeft: best(left), bestRight: best(right) });
  }

  const side = (label, key, color) => ({
    label,
    data: pts.map(p => p[key]),
    spanGaps: false,
    borderColor: color,
    backgroundColor: color + '20',
    pointStyle: pts.map(p => p.logged ? 'circle' : 'crossRot'),
    pointBackgroundColor: pts.map(p => p.logged ? color : VARIANT_MISSED_COLOR),
    pointRadius: 4,
    pointHoverRadius: 6,
    borderWidth: 2,
    fill: false,
    tension: 0.3,
  });

  const ctx = document.getElementById('calfChart').getContext('2d');
  calfCharts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => fmtDate(p.date)),
      datasets: [side('Left', 'bestLeft', '#5b8def'), side('Right', 'bestRight', '#e8a020')],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: '#9b98a0', boxWidth: 10, font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#141416',
          borderColor: '#2a2a30',
          borderWidth: 1,
          titleColor: '#e8e6e0',
          bodyColor: '#9b98a0',
          callbacks: {
            label: item => {
              const p = pts[item.dataIndex];
              if (!p.logged) return 'Not logged';
              const holds = item.datasetIndex === 0 ? p.left : p.right;
              return `${item.dataset.label}: ${holds.length ? holds.map(fmtHold).join(', ') : '—'}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 7 },
          grid: { color: '#1c1c20' },
        },
        y: {
          min: 0, max: 30,
          ticks: { color: '#6b6870', font: { size: 10 }, stepSize: 10, callback: v => v + 's' },
          grid: { color: '#1c1c20' },
        },
      },
    },
  });
}

const fmtHold = s => (s.pull || s.grip) ? `${s.seconds}s (${s.pull || s.grip})` : `${s.seconds}s`;

// Most common left heel-raise pull level, for the history summary
function calfPullSummary(l) {
  const counts = {};
  (l.heelRaiseLeft || []).forEach(s => { if (s.pull) counts[s.pull] = (counts[s.pull] || 0) + 1; });
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || '';
}

function renderCalfSetDetail(l) {
  const lines = [];
  const hrL = l.heelRaiseLeft || [], hrR = l.heelRaiseRight || [];
  if (hrL.length || hrR.length) {
    const lStr = hrL.map(s => (s.pull || s.assist) ? `${s.reps} (${s.pull || s.assist})` : `${s.reps}`).join(', ');
    const rStr = hrR.map(s => s.reps).join(', ');
    lines.push(`Heel raise${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const btL = l.bigToeLeft || [], btR = l.bigToeRight || [];
  if (btL.length || btR.length) {
    const lStr = btL.map(s => `${s.seconds}s`).join(', ');
    const rStr = btR.map(s => `${s.seconds}s`).join(', ');
    lines.push(`Big-toe press${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const seated = l.seatedCalfRaise || [];
  if (seated.length) {
    lines.push(`Seated calf raise — ${seated.map(s => `${s.reps}×${s.weight}kg`).join(', ')}`);
  }
  const ihL = l.isoHoldLeft || [], ihR = l.isoHoldRight || [];
  if (ihL.length || ihR.length) {
    const fmt = arr => arr.map(fmtHold).join(', ');
    const lStr = fmt(ihL), rStr = fmt(ihR);
    lines.push(`Iso hold${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const bkL = l.bentKneeLeft || [], bkR = l.bentKneeRight || [];
  if (bkL.length || bkR.length) {
    const fmt = arr => arr.map(s => `${s.reps}×${s.weight}kg`).join(', ');
    const lStr = fmt(bkL), rStr = fmt(bkR);
    lines.push(`Bent-knee heel raise${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  return lines.map(line => `<span>${h(line)}</span>`).join('');
}

function renderCalfHistory() {
  const list = document.getElementById('calfHistoryList');
  if (calfLogs.length === 0) {
    list.innerHTML = '<div class="empty"><strong>NO CALF LOGS YET</strong>Log your first session above.</div>';
    return;
  }
  list.innerHTML = calfLogs.slice(0, 120).map(l => {
    const setDetail = renderCalfSetDetail(l);
    const level = l.assist || calfPullSummary(l);
    return `
    <div class="hist-item">
      <div class="hist-head">
        <span class="hist-date">${fmtDate(l.date)}</span>
        <span class="hist-dow">${fmtDow(l.date)}</span>
      </div>
      <div class="hist-calf-row">
        <span>${h(l.dayType)}${level ? ` · <span class="hist-calf-assist">${h(level)}</span>` : ''}</span>
        ${l.priorActivity ? `<span>Prior: ${h(l.priorActivity)}</span>` : ''}
        ${l.soreness ? `<span>Soreness: ${h(l.soreness)}</span>` : ''}
      </div>
      ${setDetail ? `<div class="hist-calf-row">${setDetail}</div>` : ''}
      <div class="hist-records">
        <div class="hist-record">
          <span></span>
          <button class="hist-del" onclick="deleteCalfEntry('${esc(l.id)}')" title="Delete">×</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function csvField(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const header = ['Date', 'Time', 'Exercise', 'Variant', 'Sets', 'Reps', 'Total Reps', 'Notes'];
  const rows = [header];

  logs.forEach(log => {
    const time = log.timestamp
      ? new Date(log.timestamp).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false })
      : '';
    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && d.reps == null) return;
      rows.push([
        log.date,
        time,
        ex.label,
        d.variant || '',
        d.sets ?? '',
        d.reps ?? '',
        (d.sets != null && d.reps != null) ? d.sets * d.reps : '',
        log.notes || '',
      ]);
    });
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `greyskull-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCalfCSV() {
  const header = ['Date', 'DayType', 'Exercise', 'Side', 'Set', 'Reps', 'Seconds', 'Weight_kg', 'Assist', 'Grip', 'Pull', 'PriorActivity', 'Soreness'];
  const rows = [header];

  const pushRows = (l, arr, exLabel, side, repsKey, secondsKey, weightKey) => {
    (arr || []).forEach((s, idx) => {
      rows.push([
        l.date, l.dayType, exLabel, side, idx + 1,
        repsKey ? (s[repsKey] ?? '') : '',
        secondsKey ? (s[secondsKey] ?? '') : '',
        weightKey ? (s[weightKey] ?? '') : '',
        s.assist || '',
        s.grip || '',
        s.pull || '',
        l.priorActivity || '',
        l.soreness || '',
      ]);
    });
  };

  calfLogs.forEach(l => {
    pushRows(l, l.heelRaiseLeft,    'Heel raise',        'Left',  'reps', null, null);
    pushRows(l, l.heelRaiseRight,   'Heel raise',        'Right', 'reps', null, null);
    pushRows(l, l.bigToeLeft,       'Big-toe press',     'Left',  null, 'seconds', null);
    pushRows(l, l.bigToeRight,      'Big-toe press',     'Right', null, 'seconds', null);
    pushRows(l, l.seatedCalfRaise,  'Seated calf raise', '',      'reps', null, 'weight');
    pushRows(l, l.isoHoldLeft,      'Iso hold',          'Left',  null, 'seconds', null);
    pushRows(l, l.isoHoldRight,     'Iso hold',          'Right', null, 'seconds', null);
    pushRows(l, l.bentKneeLeft,     'Bent-knee heel raise', 'Left',  'reps', null, 'weight');
    pushRows(l, l.bentKneeRight,    'Bent-knee heel raise', 'Right', 'reps', null, 'weight');
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calf-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const READY_AFTER_MS = 60 * 60 * 1000;
function timeSinceLastSet(key) {
  const entry = logs.find(l => l[key].reps != null);
  if (!entry || !entry.timestamp) return null;
  const secs = Math.floor((Date.now() - new Date(entry.timestamp).getTime()) / 1000);
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}
function localDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function logKey(l) { return l.id || l.timestamp; }
function localId() { return 'local-' + (window.crypto?.randomUUID?.() || Date.now()); }
function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}
function fmtDow(ds) {
  return new Date(ds + 'T12:00:00').toLocaleDateString('en-AU', { weekday: 'long' });
}
function h(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(v) { return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

(() => {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('logDate').textContent = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
})();

load();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load(true);
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) load(true);
});
window.addEventListener('online', () => load(true));
</script>
