// ─── TARGET ───────────────────────────────────────────────────────────────────
// Set ladder: add a set up to MAX_SETS, then drop to LADDER_RESET_SETS with one more rep.
// Targets only move when the user bumps them.
function nextStep({ sets, repsPerSet }) {
  return sets < MAX_SETS ? { sets: sets + 1, repsPerSet } : { sets: LADDER_RESET_SETS, repsPerSet: repsPerSet + 1 };
}

function prevStep({ sets, repsPerSet }) {
  if (sets > LADDER_RESET_SETS || (sets > 1 && repsPerSet === 1)) return { sets: sets - 1, repsPerSet };
  if (repsPerSet > 1) return { sets: MAX_SETS, repsPerSet: repsPerSet - 1 };
  return { sets, repsPerSet };
}

function fmtTarget(t) { return `${t.sets} × ${t.repsPerSet}`; }

// Latest stored target effective on or before `date` (targets is newest first)
function storedTarget(key, date) {
  const t = targets.find(t => t.exercise === key && t.effectiveDate <= date && t.sets && t.reps);
  return t ? { sets: t.sets, repsPerSet: t.reps } : null;
}

function getTarget(key) {
  return storedTarget(key, localDateKey(new Date())) || lastSessionTarget(key);
}

// Calendar days (inclusive of today) the target has been hit with no missed session,
// counting back no further than when the stored target took effect. Today counts only once hit.
function streakDays(key, target) {
  const today = localDateKey(new Date());
  // Start of the current target: the earliest of the latest run of rows with the same value,
  // skipping rows overridden by a newer row before they took effect (e.g. an undone bump)
  let since = '', minEff = '\uffff';
  for (const t of targets) {
    if (t.exercise !== key || t.effectiveDate > today || !t.sets || !t.reps || t.effectiveDate >= minEff) continue;
    minEff = t.effectiveDate;
    if (t.sets !== target.sets || t.reps !== target.repsPerSet) break;
    since = t.effectiveDate;
  }
  const byDate = {};
  logs.forEach(l => { const e = l[key]; if (e?.sets != null && e?.reps != null) (byDate[l.date] ??= []).push(e); });
  const hit = d => byDate[d].reduce((n, e) => n + (e.reps >= target.repsPerSet ? (e.sets || 1) : 0), 0) >= target.sets;
  let start = null;
  for (const d of Object.keys(byDate).sort().reverse()) {
    if (d < since) break;
    if (!hit(d)) { if (d === today) continue; break; }
    start = d;
  }
  if (!start) return 0;
  const end = byDate[today] && hit(today) ? today : localDateKey(addDays(new Date(), -1));
  return Math.round((new Date(end) - new Date(start)) / 86400000) + 1;
}

// A bump made after finishing today's target, waiting for tomorrow
function upcomingTarget(key) {
  const t = storedTarget(key, localDateKey(addDays(new Date(), 1)));
  const cur = getTarget(key);
  return t && cur && (t.sets !== cur.sets || t.repsPerSet !== cur.repsPerSet) ? t : null;
}

async function saveTarget(key, t, effectiveDate) {
  abortLoad();
  setSync('syncing', 'Saving...');
  const row = { exercise: key, sets: t.sets, reps: t.repsPerSet, effectiveDate, timestamp: new Date().toISOString() };
  targets.unshift(row);
  try {
    row.id = await createTarget(row);
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    row.id = localId();
    setSync('err', 'Saved locally');
  }
  localStorage.setItem(TARGETS_CACHE_KEY, JSON.stringify(targets));
}

// Before today's target is done: step today's target up/down. After: queue (or undo) tomorrow's bump.
async function bumpTarget(key, dir) {
  const cur = getTarget(key) || { sets: 1, repsPerSet: defaultReps(key) };
  const today = localDateKey(new Date());
  if (todaySetsFor(key) >= cur.sets) {
    // dir < 0 undoes a queued bump by re-saving today's target for tomorrow
    await saveTarget(key, dir > 0 ? nextStep(cur) : cur, localDateKey(addDays(new Date(), 1)));
  } else {
    const t = dir > 0 ? nextStep(cur) : prevStep(cur);
    state[key].reps = String(t.repsPerSet);
    await saveTarget(key, t, today);
  }
  renderCards();
}

function lastSessionTarget(key) {
  const today = localDateKey(new Date());
  const pastDates = [...new Set(
    logs
      .filter(l => l.date !== today && l[key]?.sets != null && l[key]?.reps != null)
      .map(l => l.date)
  )].sort().reverse();

  if (!pastDates.length) return null;

  const lastDate = pastDates[0];
  const dayLogs = logs.filter(l => l.date === lastDate && l[key]?.sets != null && l[key]?.reps != null);
  const totalSets = dayLogs.reduce((sum, l) => sum + (l[key].sets || 1), 0);
  const repsPerSet = dayLogs[0]?.[key]?.reps;
  if (!repsPerSet) return null;

  return { sets: totalSets, repsPerSet };
}

// ─── LOG VIEW ─────────────────────────────────────────────────────────────────
function todaySetsFor(key) {
  const today = localDateKey(new Date());
  return logs.reduce((n, l) =>
    n + (l.date === today && l[key].sets != null && l[key].reps != null ? l[key].sets : 0), 0);
}

function lastEntry(key) {
  return logs.find(l => l[key].reps != null);
}

function restRemaining(key) {
  const entry = lastEntry(key);
  if (!entry || !entry.timestamp) return 0;
  return Math.max(0, READY_AFTER_MS - (Date.now() - new Date(entry.timestamp).getTime()));
}

function defaultReps(key) {
  return getTarget(key)?.repsPerSet || num(state[key].reps) || lastEntry(key)?.[key].reps || 5;
}

function ringHtml(done, target) {
  const r = 17.25, c = 2 * Math.PI * r;
  const pct = target ? Math.min(1, done / target) : 0;
  const label = target ? `${done}/${target}` : done;
  return `<div class="ring"><svg viewBox="0 0 38 38">
      <circle class="ring-track" cx="19" cy="19" r="${r}"/>
      ${pct > 0 ? `<circle class="ring-fill${pct >= 1 ? ' complete' : ''}" cx="19" cy="19" r="${r}" stroke-dasharray="${c * pct} ${c}"/>` : ''}
    </svg><span>${label}</span></div>`;
}

function renderCards() {
  const container = document.getElementById('exerciseCards');
  let totalDone = 0, totalTarget = 0;

  const rows = EXERCISES.map(ex => {
    const done = todaySetsFor(ex.key);
    const target = getTarget(ex.key);
    const rest = restRemaining(ex.key);
    if (target) { totalTarget += target.sets; totalDone += Math.min(done, target.sets); }
    const status = target && done >= target.sets ? 'done' : (rest > 0 ? 'rest' : 'ready');
    return { ex, done, target, rest, status };
  });

  const rowHtml = ({ ex, done, target, rest, status }) => {
    const v = state[ex.key].variant;
    if (status === 'done') {
      return `<button class="ex-row done" onclick="openLogSheet('${ex.key}')">
          <span class="ex-dot" style="background:${ex.color}"></span>
          <span class="ex-row-main"><span class="ex-row-name">${ex.label}</span></span>
          <span class="ex-row-sub">${h(v)} · ${done} sets${upcomingTarget(ex.key) ? ` · ↑ ${fmtTarget(upcomingTarget(ex.key))} next` : ''}</span>
          <span class="ex-row-check">✓</span>
        </button>`;
    }
    const sub = target ? `${h(v)} · ${target.sets} × ${target.repsPerSet}` : h(v);
    const stateHtml = status === 'ready'
      ? '<span class="ex-row-state ready">Ready</span>'
      : `<span class="ex-row-state">Rest ${Math.ceil(rest / 60000)}m</span>`;
    return `<button class="ex-row" onclick="openLogSheet('${ex.key}')">
        ${ringHtml(done, target?.sets)}
        <span class="ex-row-main"><span class="ex-row-name">${ex.label}</span><span class="ex-row-sub">${sub}</span></span>
        ${stateHtml}
        <span class="ex-row-chev">›</span>
      </button>`;
  };

  const order = { ready: 0, rest: 1, done: 2 };
  const upNext = rows.filter(r => r.status !== 'done').sort((a, b) => order[a.status] - order[b.status]);
  const done = rows.filter(r => r.status === 'done');
  container.innerHTML =
    (upNext.length ? `<div class="section-lbl ex-group-lbl">Up next</div>${upNext.map(rowHtml).join('')}` : '') +
    (done.length ? `<div class="section-lbl ex-group-lbl">Done</div>${done.map(rowHtml).join('')}` : '');

  const setsToday = rows.reduce((n, r) => n + r.done, 0);
  document.getElementById('logSummaryNum').innerHTML = totalTarget
    ? `${totalDone}<small>/${totalTarget}</small>` : `${setsToday}`;
  const bar = document.getElementById('logSummaryBar');
  bar.style.width = totalTarget ? `${Math.round(totalDone / totalTarget * 100)}%` : '0%';
  bar.classList.toggle('complete', totalTarget > 0 && totalDone >= totalTarget);

  if (sheetKey) renderLogSheet();
}

// ─── LOG SHEET ────────────────────────────────────────────────────────────────
let sheetKey = null;

function openLogSheet(key) {
  sheetKey = key;
  state[key].reps = String(defaultReps(key));
  renderLogSheet();
  document.getElementById('logSheetWrap').classList.add('sheet-open');
  document.getElementById('sheetLogBtn').focus({ preventScroll: true });
}

function closeLogSheet() {
  sheetKey = null;
  document.getElementById('logSheetWrap').classList.remove('sheet-open');
}

function renderLogSheet() {
  const key = sheetKey;
  const ex = EXERCISES.find(e => e.key === key);
  const s = state[key];
  const done = todaySetsFor(key);
  const target = getTarget(key);
  const reps = num(s.reps);

  document.getElementById('sheetTitle').textContent = ex.label;
  const parts = [];
  if (target) parts.push(done < target.sets ? `Set ${done + 1} of ${target.sets}` : `${done} of ${target.sets} sets done`);
  else if (done) parts.push(`${done} set${done !== 1 ? 's' : ''} today`);
  const last = lastEntry(key);
  if (last) parts.push(`last ${last[key].reps} reps, ${timeSinceLastSet(key)}`);
  document.getElementById('sheetSub').textContent = parts.join(' · ');

  const pending = upcomingTarget(key);
  const isDone = target && done >= target.sets;
  const streak = target ? streakDays(key, target) : 0;
  document.getElementById('sheetTarget').innerHTML = isDone && pending
    ? `<span class="grow">Next time <b>${fmtTarget(pending)}</b></span><button onclick="bumpTarget('${key}',-1)">Undo</button>`
    : isDone && streak >= BUMP_AFTER_DAYS
    ? `<span class="grow">A week at ${fmtTarget(target)}. Felt easy? Next time <b>${fmtTarget(nextStep(target))}</b></span><button class="primary" onclick="bumpTarget('${key}',1)">Bump</button>`
    : `${isDone ? '' : `<button onclick="bumpTarget('${key}',-1)" aria-label="Easier target"${target ? '' : ' disabled'}>−</button>`}
       <span class="grow">Target <b>${target ? fmtTarget(target) : '—'}</b>${target ? ` · day ${Math.min(streak + (isDone ? 0 : 1), BUMP_AFTER_DAYS)} of ${BUMP_AFTER_DAYS}` : ''}</span>
       <button onclick="bumpTarget('${key}',1)" aria-label="Harder target">+</button>`;

  document.getElementById('sheetDots').innerHTML = target
    ? Array.from({ length: Math.max(target.sets, done) }, (_, i) => `<i class="${i < done ? 'filled' : ''}"></i>`).join('')
    : '';
  document.getElementById('sheetVariants').innerHTML = ex.variants.map(v =>
    `<button class="pill${s.variant === v ? ' active' : ''}" onclick="setVariant('${key}','${esc(v)}')">${h(v)}</button>`
  ).join('');
  document.getElementById('sheetReps').textContent = reps;

  const start = Math.max(1, reps - 2);
  document.getElementById('sheetQuick').innerHTML = [0, 1, 2, 3, 4].map(i => start + i).map(n =>
    `<button class="${n === reps ? 'active' : ''}" onclick="setReps(${n})">${n}</button>`
  ).join('');
}

function setReps(n) {
  state[sheetKey].reps = String(Math.max(1, n));
  renderLogSheet();
}

function stepReps(d) {
  setReps(num(state[sheetKey].reps) + d);
}

function setVariant(key, variant) {
  state[key].variant = variant;
  renderCards();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetKey) closeLogSheet();
  if (e.key === 'Escape' && calfSheet) closeCalfSheet();
});

// Keep rest countdowns current while the Today tab is open
setInterval(() => {
  if (document.getElementById('viewToday').classList.contains('active')) renderCards();
}, 30000);

// ─── LOG EXERCISE ─────────────────────────────────────────────────────────────
async function logExercise(key) {
  const s = state[key];
  const reps = num(s.reps);
  if (!reps) return;

  abortLoad();
  const btn = document.getElementById('sheetLogBtn');
  btn.disabled = true;
  btn.textContent = '...';
  setSync('syncing', 'Saving...');

  const now = new Date();
  const log = {
    timestamp: now.toISOString(),
    date: localDateKey(now),
    notes: '',
  };
  EXERCISES.forEach(ex => { log[ex.key] = { variant: '', sets: null, reps: null }; });
  log[key] = { variant: s.variant, sets: num(s.sets) || 1, reps: reps };

  try {
    log.id = await createLog(log);
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    log.id = localId();
    logs.unshift(log);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('err', 'Saved locally');
    alert('Airtable unavailable — kept locally.\n\n' + e.message);
  }

  renderCards();
  renderHistory();

  // Keep reps and variant so the next set is one tap
  btn.textContent = '✓';
  btn.style.background = 'var(--green)';
  setTimeout(() => {
    closeLogSheet();
    btn.disabled = false;
    btn.textContent = 'LOG SET';
    btn.style.background = '';
  }, 700);
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
async function deleteEntry(key) {
  const log = logs.find(l => logKey(l) === key);
  if (!log || !confirm('Delete this entry?')) return;
  abortLoad();
  setSync('syncing', 'Deleting...');
  try {
    if (log.id && !log.id.startsWith('local-')) await deleteLog(log.id);
    logs = logs.filter(l => logKey(l) !== key);
    localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
    setSync('ok', 'Deleted');
    renderHistory();
    renderCards();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

// ─── HISTORY RENDER ───────────────────────────────────────────────────────────
const HISTORY_FILTERS = [['all', 'All'], ['workouts', 'Workouts'], ['calf', 'Calf']];

function setHistoryFilter(f) {
  historyFilter = f;
  renderHistory();
}

// Workouts and calf sessions in one list, newest day first (workouts before calf within a day)
function renderHistory() {
  document.getElementById('historyFilter').innerHTML = HISTORY_FILTERS.map(([key, label]) =>
    `<button class="pill${key === historyFilter ? ' active' : ''}" onclick="setHistoryFilter('${key}')">${label}</button>`).join('');
  document.getElementById('historyExport').innerHTML = {
    all: `<button class="export-btn" onclick="exportCSV()">Workouts CSV</button><button class="export-btn" onclick="exportCalfCSV()">Calf CSV</button>`,
    workouts: `<button class="export-btn" onclick="exportCSV()">Export CSV</button>`,
    calf: `<button class="export-btn" onclick="exportCalfCSV()">Export CSV</button>`,
  }[historyFilter];

  const items = [
    ...(historyFilter !== 'calf' ? workoutHistoryItems().map(x => ({ ...x, order: 0 })) : []),
    ...(historyFilter !== 'workouts' ? calfHistoryItems().map(x => ({ ...x, order: 1 })) : []),
  ].sort((a, b) => b.date.localeCompare(a.date) || a.order - b.order);

  const empty = { all: 'NO LOGS YET', workouts: 'NO WORKOUTS YET', calf: 'NO CALF LOGS YET' }[historyFilter];
  document.getElementById('historyList').innerHTML = items.length
    ? items.map(x => x.html).join('')
    : `<div class="empty"><strong>${empty}</strong>Log your first set on the Today tab.</div>`;
}

function histHead(date, kind) {
  return `<div class="hist-head">
      <span class="hist-date">${fmtDate(date)}</span>
      <span class="hist-dow"><span class="hist-kind${kind === 'Calf' ? ' calf' : ''}">${kind}</span>${fmtDow(date)}</span>
    </div>`;
}

function workoutHistoryItems() {
  // Group records by date
  const dateOrder = [];
  const byDate = {};
  logs.slice(0, 120).forEach(log => {
    if (!byDate[log.date]) {
      byDate[log.date] = { exercises: {}, records: [] };
      dateOrder.push(log.date);
    }
    byDate[log.date].records.push(log);

    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && !d.variant) return;
      if (!byDate[log.date].exercises[ex.key]) {
        byDate[log.date].exercises[ex.key] = { totalSets: 0, totalReps: 0, variant: '' };
      }
      const g = byDate[log.date].exercises[ex.key];
      if (d.sets != null) g.totalSets += d.sets;
      if (d.sets != null && d.reps != null) g.totalReps += d.sets * d.reps;
      if (d.variant) g.variant = d.variant;
    });
  });

  return dateOrder.map(date => {
    const entry = byDate[date];

    const exRows = EXERCISES.map(ex => {
      const g = entry.exercises[ex.key];
      if (!g) return '';
      const vol = g.totalReps > 0
        ? `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''} · ${g.totalReps} reps`
        : `${g.totalSets} set${g.totalSets !== 1 ? 's' : ''}`;
      return `<div class="hist-ex">
        <span class="hist-ex-name">${ex.label}</span>
        <span class="hist-ex-vol">${vol}</span>
        <span class="hist-ex-var">${h(g.variant)}</span>
      </div>`;
    }).filter(Boolean).join('');

    const recordRows = entry.records.map(log => {
      const key = logKey(log);
      const parts = EXERCISES
        .filter(ex => log[ex.key].sets != null)
        .map(ex => {
          const d = log[ex.key];
          return `${ex.label} ${d.sets}×${d.reps}`;
        });
      const desc = parts.join(' · ') || '—';
      return `<div class="hist-record">
        <span>${h(desc)}</span>
        <button class="hist-del" onclick="deleteEntry('${key}')" title="Delete">×</button>
      </div>`;
    }).join('');

    return { date, html: `<div class="hist-item">
      ${histHead(date, 'Workout')}
      <div class="hist-exercises">
        ${exRows || '<span style="color:var(--muted);font-size:12px">Nothing logged</span>'}
      </div>
      <div class="hist-records">${recordRows}</div>
    </div>` };
  });
}

// ─── PROGRESS RENDER ──────────────────────────────────────────────────────────
function tierFor(score) {
  const i = RANK_TIERS.findLastIndex(t => score >= t.min);
  return { ...RANK_TIERS[i], next: RANK_TIERS[i + 1] || null };
}

// Best single set for `ex` in the rank window, scored against RANK_STANDARDS
function exerciseScore(ex) {
  const std = RANK_STANDARDS[ex.key];
  const from = localDateKey(addDays(new Date(), -(RANK_WINDOW_DAYS - 1)));
  let best = null;
  logs.forEach(l => {
    const e = l[ex.key];
    const band = std[e.variant];
    if (!band || l.date < from || !e.reps) return;
    const [lo, hi, cap] = band;
    const score = Math.round(lo + (hi - lo) * Math.min(e.reps, cap) / cap);
    if (!best || score > best.score) best = { score, variant: e.variant, reps: e.reps, date: l.date };
  });
  return best;
}

function rankKpi(ex) {
  const s = exerciseScore(ex);
  if (!s) return `<div class="kpi"><span class="focus-lbl">Rank</span><b>—</b><span>Unranked</span></div>`;
  const tier = tierFor(s.score);
  return `<div class="kpi"><span class="focus-lbl">Rank · ${tier.name}</span><b style="color:${tier.color}">${s.score}</b><span>${h(s.variant)} × ${s.reps}</span></div>`;
}

function renderRankCard() {
  const el = document.getElementById('rankCard');
  const scores = EXERCISES.map(ex => ({ ex, s: exerciseScore(ex) }));
  const ranked = scores.filter(x => x.s);
  if (!ranked.length) {
    el.innerHTML = `<div class="rank-card"><div class="focus-lbl">Athleticism</div><div class="rank-empty">Log a set to get ranked</div></div>`;
    return;
  }
  const overall = Math.round(ranked.reduce((sum, x) => sum + x.s.score, 0) / ranked.length);
  const tier = tierFor(overall);
  const pct = tier.next ? (overall - tier.min) / (tier.next.min - tier.min) * 100 : 100;
  el.innerHTML = `
    <div class="rank-card">
      <div class="rank-head">
        <div>
          <div class="focus-lbl">Athleticism · last ${RANK_WINDOW_DAYS} days</div>
          <div class="rank-tier" style="color:${tier.color}">${tier.name}</div>
        </div>
        <div class="rank-score">${overall}<small>/100</small></div>
      </div>
      <div class="rank-bar"><div style="width:${pct}%;background:${tier.color}"></div></div>
      <div class="rank-next">${tier.next ? `${tier.next.min - overall} pts to ${tier.next.name}` : 'Top tier'}</div>
      <div class="rank-chips">${scores.map(({ ex, s }) => `
        <button class="rank-chip" onclick="setProgressEx('${ex.key}')">
          <span class="dot" style="background:${ex.color}"></span><span class="lbl">${ex.label}</span>
          <b style="color:${s ? tierFor(s.score).color : 'var(--muted)'}">${s ? s.score : '—'}</b>
        </button>`).join('')}
      </div>
    </div>`;
}

function renderProgress() {
  renderRankCard();
  renderExPills();
  renderFocus();
}

function renderExPills() {
  document.getElementById('exPills').innerHTML = [...EXERCISES, CALF_PROGRESS_PILL].map(ex => `
    <button class="pill${ex.key === progressEx ? ' active' : ''}" onclick="setProgressEx('${ex.key}')">
      <span class="dot" style="background:${ex.color}"></span>${ex.label}
    </button>`).join('');
}

function setProgressEx(key) {
  progressEx = key;
  renderProgress();
}

function setChartRange(range) {
  chartRange = range;
  document.querySelectorAll('#rangeStrip button').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  renderFocus();
}

// ─── VARIANT COLORS (Progress charts) ─────────────────────────────────────────
// Keyed by a variant's position within its exercise's own `variants` array —
// identity only, not a difficulty ordering (e.g. pushup's array isn't a strict ladder).
const VARIANT_PALETTE = ['#5b8def', '#e8a020', '#3ab06a', '#d63a2f', '#a35bef', '#2fb8c4'];
const VARIANT_MISSED_COLOR = '#45454c';

function variantColor(ex, variant) {
  if (!variant) return VARIANT_MISSED_COLOR;
  const idx = ex.variants.indexOf(variant);
  return VARIANT_PALETTE[(idx < 0 ? 0 : idx) % VARIANT_PALETTE.length];
}

// Per-day totals for `ex` with from <= date <= to: sum sets×reps across all records per day
function dailySessions(ex, from, to) {
  const byDate = {};
  logs
    .filter(l => l.date >= from && l.date <= to && l[ex.key].sets != null && l[ex.key].reps != null)
    .forEach(l => {
      const d = l.date;
      if (!byDate[d]) byDate[d] = { date: d, total: 0, sets: 0, maxReps: 0, mixed: false, variant: l[ex.key].variant };
      if (byDate[d].sets && byDate[d].maxReps !== l[ex.key].reps) byDate[d].mixed = true;
      byDate[d].total += l[ex.key].sets * l[ex.key].reps;
      byDate[d].sets += l[ex.key].sets;
      byDate[d].maxReps = Math.max(byDate[d].maxReps, l[ex.key].reps);
      byDate[d].variant = l[ex.key].variant; // use most recent variant for label
    });
  return byDate;
}

function fmtScheme(p) {
  return p.mixed ? `${p.sets} sets · best ${p.maxReps}` : `${p.sets}×${p.maxReps}`;
}

// Shades each run of same-variant sessions and labels it at the top
const variantBandsPlugin = {
  id: 'variantBands',
  beforeDatasetsDraw(chart, _args, opts) {
    const { ctx, chartArea: { top, bottom, left, right }, scales: { x } } = chart;
    const runs = opts.runs;
    ctx.save();
    runs.forEach((run, i) => {
      const x0 = i === 0 ? left : (x.getPixelForValue(runs[i - 1].end) + x.getPixelForValue(run.start)) / 2;
      const x1 = i === runs.length - 1 ? right : (x.getPixelForValue(run.end) + x.getPixelForValue(runs[i + 1].start)) / 2;
      ctx.fillStyle = run.color + '14';
      ctx.fillRect(x0, top, x1 - x0, bottom - top);
      ctx.font = '700 9px "Instrument Sans", sans-serif';
      const label = run.variant.toUpperCase();
      if (ctx.measureText(label).width + 12 <= x1 - x0) {
        ctx.fillStyle = run.color;
        ctx.fillText(label, x0 + 6, top + 12);
      }
    });
    ctx.restore();
  },
};

function renderFocus() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
  if (calfCharts.trend) { calfCharts.trend.destroy(); delete calfCharts.trend; }

  // The calf iso hold chart has its own fixed A-day axis, so the range strip doesn't apply
  const isCalf = progressEx === CALF_PROGRESS_PILL.key;
  document.getElementById('rangeStrip').style.display = isCalf ? 'none' : '';
  if (isCalf) {
    document.getElementById('progressBody').innerHTML = `
      <div class="focus-head"><div class="focus-lbl">Iso hold · best per A-day</div></div>
      <div class="chart-block" id="calfChartBlock"></div>`;
    renderCalfChart();
    return;
  }

  const ex = EXERCISES.find(e => e.key === progressEx) || EXERCISES[0];
  const body = document.getElementById('progressBody');

  const todayDate = new Date();
  const today = localDateKey(todayDate);
  let cutoffDate;
  if (chartRange === 'all') {
    const earliest = logs.reduce((min, l) => (l.date && (!min || l.date < min)) ? l.date : min, null);
    cutoffDate = earliest ? new Date(earliest + 'T00:00:00') : addDays(todayDate, -30);
  } else {
    const days = { '1w': 7, '1m': 30, '3m': 90 }[chartRange] || 30;
    cutoffDate = addDays(todayDate, -(days - 1));
  }
  const cutoff = localDateKey(cutoffDate);

  const byDate = dailySessions(ex, cutoff, today);
  const sessions = Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));

  if (!sessions.length) {
    body.innerHTML = `
      <div class="focus-head"><div class="focus-lbl">${ex.label} · best reps per set</div></div>
      <div class="chart-empty">No ${ex.label.toLowerCase()} logged in this range</div>`;
    return;
  }

  // Every day in range, so the x axis is time-true; missed days are gaps the line spans
  const days = [];
  for (let d = new Date(cutoffDate); d <= todayDate; d = addDays(d, 1)) days.push(localDateKey(d));
  const pts = days.map(ds => byDate[ds] || null);

  // Spanned gaps give segment callbacks a null p0, so carry each day's last-seen variant forward
  const carried = [];
  pts.forEach((p, i) => { carried[i] = p ? p.variant : carried[i - 1]; });

  // Runs of consecutive sessions on the same variant
  const runs = [];
  pts.forEach((p, i) => {
    if (!p) return;
    const last = runs[runs.length - 1];
    if (last && last.variant === p.variant) last.end = i;
    else runs.push({ variant: p.variant, color: variantColor(ex, p.variant), start: i, end: i });
  });

  const latest = sessions[sessions.length - 1];
  const current = runs[runs.length - 1];
  const runStart = pts[current.start];
  const delta = latest.maxReps - runStart.maxReps;
  const deltaWhen = runs.length > 1 ? 'since switching'
    : { '1w': 'this week', '1m': 'this month', '3m': 'in 3 months', all: 'all time' }[chartRange];
  const deltaText = delta === 0 ? `No change ${deltaWhen}` : `${delta > 0 ? '▲' : '▼'} ${Math.abs(delta)} ${deltaWhen}`;

  const onVariant = sessions.filter(s => s.variant === latest.variant);
  const best = onVariant.reduce((b, s) => s.maxReps >= b.maxReps ? s : b, onVariant[0]);

  const volume = sessions.reduce((sum, s) => sum + s.total, 0);
  let volumeSub = 'all time';
  if (chartRange !== 'all') {
    const prior = Object.values(dailySessions(ex, localDateKey(addDays(cutoffDate, -days.length)), localDateKey(addDays(cutoffDate, -1))))
      .reduce((sum, s) => sum + s.total, 0);
    volumeSub = prior ? `${volume >= prior ? '▲' : '▼'} ${Math.abs(Math.round((volume - prior) / prior * 100))}% vs prior` : 'no prior data';
  }

  body.innerHTML = `
    <div class="focus-head">
      <div>
        <div class="focus-lbl">${ex.label} · best reps per set</div>
        <div class="focus-val"><b>${latest.maxReps}</b><span style="color:${variantColor(ex, latest.variant)}">${h(latest.variant)}</span></div>
      </div>
      <span class="focus-delta ${delta > 0 ? 'up' : delta < 0 ? 'down' : ''}">${deltaText}</span>
    </div>
    <div class="focus-chart"><canvas id="focusChart"></canvas></div>
    <div class="focus-lbl">Total reps per session</div>
    <div class="focus-bars"><canvas id="focusBars"></canvas></div>
    <div class="kpis">
      <div class="kpi"><span class="focus-lbl">Best set</span><b>${best.mixed ? best.maxReps : `${best.sets}×${best.maxReps}`}</b><span>${h(best.variant)} · ${fmtDate(best.date)}</span></div>
      <div class="kpi"><span class="focus-lbl">Volume</span><b>${volume}</b><span>${volumeSub}</span></div>
      <div class="kpi"><span class="focus-lbl">Sessions</span><b>${sessions.length}</b><span>of ${days.length} days</span></div>
      ${rankKpi(ex)}
    </div>`;

  const labels = days.map(fmtDate);
  const lastIdx = pts.length - 1 - [...pts].reverse().findIndex(Boolean);
  const dense = pts.length > 45;
  const fixedYWidth = scale => { scale.width = 28; };
  const tooltip = {
    backgroundColor: '#141416',
    borderColor: '#2a2a30',
    borderWidth: 1,
    titleColor: '#e8e6e0',
    bodyColor: '#9b98a0',
    displayColors: false,
  };

  charts.focus = new Chart(document.getElementById('focusChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: pts.map(p => p ? p.maxReps : null),
        spanGaps: true,
        borderWidth: 2.2,
        tension: 0.25,
        pointBackgroundColor: pts.map(p => p ? variantColor(ex, p.variant) : 'transparent'),
        pointBorderColor: pts.map((p, i) => i === lastIdx ? '#0c0c0e' : p ? variantColor(ex, p.variant) : 'transparent'),
        pointBorderWidth: pts.map((_, i) => i === lastIdx ? 2 : 1),
        pointRadius: pts.map((p, i) => i === lastIdx ? 5 : p && !dense ? 3 : 0),
        pointHoverRadius: 6,
        segment: {
          // A variant switch is drawn as a muted dashed connector: the drop is the harder variant, not regression
          borderColor: c => carried[c.p0DataIndex] === carried[c.p1DataIndex]
            ? variantColor(ex, carried[c.p1DataIndex]) : VARIANT_MISSED_COLOR,
          borderDash: c => carried[c.p0DataIndex] === carried[c.p1DataIndex] ? undefined : [3, 3],
        },
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        variantBands: { runs },
        tooltip: {
          ...tooltip,
          callbacks: {
            label: item => {
              const p = pts[item.dataIndex];
              return `${fmtScheme(p)} · ${p.total} total · ${p.variant}`;
            },
          },
        },
      },
      scales: {
        x: {
          offset: true,
          ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 4, maxRotation: 0 },
          grid: { display: false },
        },
        y: {
          min: 0,
          suggestedMax: Math.max(...sessions.map(s => s.maxReps)) + 1,
          afterFit: fixedYWidth,
          ticks: { color: '#6b6870', font: { size: 10 }, precision: 0, maxTicksLimit: 5 },
          grid: { color: '#1c1c20' },
          border: { display: false },
        },
      },
    },
    plugins: [variantBandsPlugin],
  });

  charts.bars = new Chart(document.getElementById('focusBars'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: pts.map(p => p ? p.total : null),
        backgroundColor: pts.map(p => p ? variantColor(ex, p.variant) + 'b3' : 'transparent'),
        borderRadius: 2,
        maxBarThickness: 8,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { ...tooltip, callbacks: { label: item => `${pts[item.dataIndex].total} total reps` } },
      },
      scales: {
        x: { offset: true, display: false },
        y: { min: 0, afterFit: fixedYWidth, ticks: { display: false }, grid: { display: false }, border: { display: false } },
      },
    },
  });
}

// ─── CALF RENDER ──────────────────────────────────────────────────────────────
const CALF_SET_KEYS = ['heelRaiseLeft', 'heelRaiseRight', 'bigToeLeft', 'bigToeRight', 'seatedCalfRaise',
  'isoHoldLeft', 'isoHoldRight', 'bentKneeLeft', 'bentKneeRight'];
const PRIOR_ACTIVITY_OPTIONS = ['Skated', 'Rode', 'Long walk', 'Nothing'];

// Exercises for a day: per-side set counts, targets and the per-set level scale (ordered more → less help)
function calfPlan(dateStr) {
  const type = calfDayType(dateStr), block = calfBlock(dateStr), pull = usesPull(dateStr);
  const side = (key, short, sets, target, level) => ({ key, short, label: short === 'L' ? 'Left' : 'Right', sets, target, level });
  const scale = (prop, label, levels) => ({ prop, label, levels });
  const assist = scale('assist', 'Right-leg assist', ASSIST_LEVELS);

  if (type === 'A' && block === 1) return [
    { id: 'heelRaise', title: 'Two-up, one-down heel raise', sub: 'Right-leg assist', kind: 'reps',
      sides: [side('heelRaiseLeft', 'L', 3, 6, assist), side('heelRaiseRight', 'R', 2, 6)] },
    { id: 'bigToe', title: 'Big-toe press', sub: 'Hold', kind: 'seconds',
      sides: [side('bigToeLeft', 'L', 3, 30), side('bigToeRight', 'R', 3, 30)] },
  ];
  if (type === 'A') {
    const heelLevel = pull ? scale('pull', 'Pull on doorframe', HEEL_PULL_LEVELS) : assist;
    const isoLevel = pull ? scale('pull', 'Pull on doorframe', ISO_PULL_LEVELS) : scale('grip', 'Grip', GRIP_LEVELS);
    return [
      { id: 'heelRaise', title: 'Two-up, one-down heel raise', sub: pull ? 'Doorframe pull' : 'Clean reps', kind: 'reps',
        sides: [side('heelRaiseLeft', 'L', 5, 4, heelLevel), side('heelRaiseRight', 'R', 2, 6)] },
      { id: 'isoHold', title: 'Mid-height iso hold', sub: 'Doorframe · 30s cap', kind: 'seconds', cap: 30,
        sides: [side('isoHoldLeft', 'L', 3, null, isoLevel), side('isoHoldRight', 'R', 2, null, isoLevel)] },
    ];
  }
  if (type === 'B' && block === 1) return [
    { id: 'seated', title: 'Seated calf raise', sub: 'Easy, well short of failure', kind: 'repsWeight',
      sides: [{ key: 'seatedCalfRaise', short: '', label: '', sets: 2, target: null }] },
  ];
  if (type === 'B') return [
    { id: 'bentKnee', title: 'Bent-knee heel raise', sub: 'Loaded', kind: 'repsWeight',
      sides: [side('bentKneeLeft', 'L', 2, 15), side('bentKneeRight', 'R', 2, 15)] },
  ];
  return [];
}

const calfValueProp = ex => ex.kind === 'seconds' ? 'seconds' : 'reps';
const calfSets = side => calfSetsState[side.key] || [];

function calfTargetsText(ex) {
  const unit = ex.kind === 'seconds' ? 's' : '';
  return ex.sides.map(s => `${s.short ? s.short + ' ' : ''}${s.sets}${s.target ? `×${s.target}${unit}` : ''}`).join(' · ');
}

// Last logged value of `prop` in the sets stored under `setsKey`
function lastCalfSetValue(setsKey, prop) {
  const recent = calfLogs.find(l => (l[setsKey] || []).some(s => s[prop]));
  return recent ? recent[setsKey].filter(s => s[prop]).pop()[prop] : null;
}

function lastCalfLevel(side) {
  const { prop, levels } = side.level;
  const last = lastCalfSetValue(side.key, prop) || (prop === 'assist' ? (calfLogs.find(l => l.assist) || {}).assist : null);
  return levels.includes(last) ? last : levels[prop === 'grip' ? 0 : 1];
}

// Starting values for the next set: the target, else today's previous set, else the last session
function calfDraft(ex, side) {
  const prev = calfSets(side)[calfSets(side).length - 1];
  const prop = calfValueProp(ex);
  const draft = { [prop]: side.target ?? prev?.[prop] ?? lastCalfSetValue(side.key, prop) ?? (prop === 'seconds' ? 20 : 12) };
  if (ex.kind === 'repsWeight') draft.weight = prev?.weight ?? lastCalfSetValue(side.key, 'weight') ?? 10;
  if (side.level) draft[side.level.prop] = prev?.[side.level.prop] || lastCalfLevel(side);
  return draft;
}

function renderCalfForm() {
  const today = localDateKey(new Date());
  if (!calfDay || calfDaySetOn !== today) { calfDay = today; calfDaySetOn = today; }
  const existing = calfLogs.find(l => l.date === calfDay);
  calfSetsState = {};
  CALF_SET_KEYS.forEach(k => { calfSetsState[k] = (existing?.[k] || []).map(s => ({ ...s })); });
  document.getElementById('calfPriorActivity').value = existing?.priorActivity || '';
  document.getElementById('calfSoreness').value = existing?.soreness || '';
  renderCalfDay();
  renderCalfNotes();
}

function setCalfDay(ds) {
  if (ds > localDateKey(new Date())) return;
  calfDay = ds;
  calfDaySetOn = localDateKey(new Date());
  renderCalfForm();
  renderCalfWeek();
}

function stepCalfDay(d) {
  setCalfDay(localDateKey(addDays(new Date(calfDay + 'T12:00:00'), d)));
}

function renderCalfDay() {
  const type = calfDayType(calfDay);
  const plan = calfPlan(calfDay);
  const d = new Date(calfDay + 'T12:00:00');
  document.getElementById('calfDayLabel').textContent =
    d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }).replace(',', '').toUpperCase();
  const tag = document.getElementById('calfDayType');
  tag.textContent = CALF_DAYTYPE_LABEL[type];
  tag.className = 'calf-tag ' + (type === 'A' ? 'a-day' : type === 'B' ? 'b-day' : '');
  document.getElementById('calfBlockTag').textContent = `Block ${calfBlock(calfDay)}`;
  document.getElementById('calfNextDay').disabled = calfDay >= localDateKey(new Date());

  let done = 0, total = 0;
  plan.forEach(ex => ex.sides.forEach(s => { done += Math.min(calfSets(s).length, s.sets); total += s.sets; }));
  document.getElementById('calfProgress').textContent = total ? `${done} of ${total} sets logged` : '';
  document.getElementById('calfExerciseCards').innerHTML = plan.length
    ? plan.map(calfCardHtml).join('')
    : '<div class="calf-off-note">Off day — nothing scheduled.</div>';
  document.getElementById('calfNotes').style.display = plan.length ? '' : 'none';
}

function calfCardHtml(ex) {
  const sideRow = s => {
    const sets = calfSets(s);
    const last = sets[sets.length - 1];
    const bars = Array.from({ length: Math.max(s.sets, sets.length) }, (_, i) =>
      `<i class="${i < sets.length ? 'on' : i === sets.length ? 'next' : ''}"></i>`).join('');
    let info = `<b>${sets.length}</b>/${s.sets}`;
    if (ex.kind === 'seconds' && sets.length) info += ` · best ${Math.max(...sets.map(x => x.seconds))}s`;
    if (ex.kind === 'repsWeight' && last) info += ` · ${last.weight} kg`;
    if (s.level && last?.[s.level.prop]) info += ` · ${h(last[s.level.prop])}`;
    return `<span class="calf-side"><b>${s.short}</b><span class="calf-bars">${bars}</span><span class="calf-side-info">${info}</span></span>`;
  };
  const complete = ex.sides.every(s => calfSets(s).length >= s.sets);
  return `<button class="calf-card${complete ? ' done' : ''}" onclick="openCalfSheet('${ex.id}')">
      <span class="calf-card-top">
        <span><span class="ex-row-name">${h(ex.title)}</span><span class="ex-row-sub">${h(ex.sub)} · ${calfTargetsText(ex)}</span></span>
        ${complete ? '<span class="ex-row-check">✓</span>' : '<span class="ex-row-chev">›</span>'}
      </span>
      ${ex.sides.map(sideRow).join('')}
    </button>`;
}

// ─── CALF NOTES ───────────────────────────────────────────────────────────────
function calfActivityList() {
  return document.getElementById('calfPriorActivity').value.split(',').map(s => s.trim()).filter(Boolean);
}

function toggleCalfActivity(opt) {
  const is = a => a.toLowerCase() === opt.toLowerCase();
  let list = calfActivityList();
  list = list.some(is) ? list.filter(a => !is(a))
    : opt === 'Nothing' ? [opt]
    : [...list.filter(a => a.toLowerCase() !== 'nothing'), opt];
  document.getElementById('calfPriorActivity').value = list.join(', ');
  renderCalfNotes();
  saveCalfEntry();
}

function renderCalfNotes() {
  const list = calfActivityList();
  const lower = list.map(a => a.toLowerCase());
  document.getElementById('calfActivityPills').innerHTML = PRIOR_ACTIVITY_OPTIONS.map(o =>
    `<button class="pill${lower.includes(o.toLowerCase()) ? ' active' : ''}" onclick="toggleCalfActivity('${esc(o)}')">${h(o)}</button>`
  ).join('');
  const sore = document.getElementById('calfSoreness').value.trim();
  document.getElementById('calfNotesSummary').textContent =
    [list.join(', '), sore].filter(Boolean).join(' · ') || "Prior day's activity · soreness";
}

// ─── CALF SET SHEET ───────────────────────────────────────────────────────────
function calfSheetCtx() {
  const ex = calfPlan(calfDay).find(e => e.id === calfSheet.exId);
  return { ex, side: ex.sides.find(s => s.key === calfSheet.sideKey) };
}

function openCalfSheet(exId) {
  const ex = calfPlan(calfDay).find(e => e.id === exId);
  const side = ex.sides.find(s => calfSets(s).length < s.sets) || ex.sides[0];
  calfSheet = { exId, sideKey: side.key, editIdx: null, draft: calfDraft(ex, side) };
  renderCalfSheet();
  document.getElementById('calfSheetWrap').classList.add('sheet-open');
  document.getElementById('calfSheetBtn').focus({ preventScroll: true });
}

function closeCalfSheet() {
  calfSheet = null;
  document.getElementById('calfSheetWrap').classList.remove('sheet-open');
}

function setCalfSheetSide(key) {
  const { ex } = calfSheetCtx();
  calfSheet.sideKey = key;
  calfSheet.editIdx = null;
  calfSheet.draft = calfDraft(ex, ex.sides.find(s => s.key === key));
  renderCalfSheet();
}

function editCalfSet(idx) {
  const { ex, side } = calfSheetCtx();
  if (calfSheet.editIdx === idx) {
    calfSheet.editIdx = null;
    calfSheet.draft = calfDraft(ex, side);
  } else {
    calfSheet.editIdx = idx;
    calfSheet.draft = { ...calfSets(side)[idx] };
  }
  renderCalfSheet();
}

function stepCalfDraft(prop, d) {
  const { ex } = calfSheetCtx();
  const v = Math.max(prop === 'weight' ? 0 : 1, (Number(calfSheet.draft[prop]) || 0) + d);
  setCalfDraft(prop, prop === 'seconds' && ex.cap ? Math.min(ex.cap, v) : v);
}

function setCalfDraft(prop, v) {
  calfSheet.draft[prop] = v;
  renderCalfSheet();
}

function renderCalfSheet() {
  const { ex, side } = calfSheetCtx();
  const sets = calfSets(side);
  const prop = calfValueProp(ex);
  const draft = calfSheet.draft;
  const editing = calfSheet.editIdx != null;
  const setNo = editing ? calfSheet.editIdx + 1 : sets.length + 1;
  const val = Number(draft[prop]) || 0;
  const unit = prop === 'seconds' ? 's' : ' reps';

  const status = editing ? `Editing set ${setNo}`
    : (setNo > side.sets ? `Extra set ${setNo}` : `Set ${setNo} of ${side.sets}`) +
      (side.target ? ` · target ${side.target}${unit}` : ex.cap ? ` · ${ex.cap}s cap` : '');
  const seg = ex.sides.length < 2 ? '' : `<div class="seg calf-seg">${ex.sides.map(s =>
    `<button class="${s.key === side.key ? 'active' : ''}" onclick="setCalfSheetSide('${s.key}')">${s.label}<small>${calfSets(s).length}/${s.sets}</small></button>`
  ).join('')}</div>`;
  const quick = ex.cap ? [10, 15, 20, 25, 30].filter(n => n <= ex.cap)
    : prop === 'seconds' ? [-10, -5, 0, 5, 10].map(d => Math.max(15, Math.round(val / 5) * 5) + d)
    : [0, 1, 2, 3, 4].map(i => Math.max(1, val - 2) + i);
  const weight = ex.kind !== 'repsWeight' ? '' : `
    <div class="sheet-target">
      <span class="grow">Weight <b>${draft.weight} kg</b></span>
      <button onclick="stepCalfDraft('weight',-0.5)" aria-label="Less weight">−</button>
      <button onclick="stepCalfDraft('weight',0.5)" aria-label="More weight">+</button>
    </div>`;
  const level = !side.level ? '' : `
    <div>
      <span class="input-lbl">${h(side.level.label)}</span>
      <div class="level-scale">${side.level.levels.map(v =>
        `<button class="${draft[side.level.prop] === v ? 'active' : ''}" onclick="setCalfDraft('${side.level.prop}','${esc(v)}')">${h(v)}</button>`
      ).join('')}</div>
      <div class="level-ends"><span>more help</span><span>less help</span></div>
    </div>`;
  const fmtSet = s => [
    s[prop] != null ? s[prop] + (prop === 'seconds' ? 's' : '') : '',
    s.weight != null ? `${s.weight} kg` : '',
    side.level ? s[side.level.prop] : '',
  ].filter(Boolean).join(' · ');
  const chips = !sets.length ? '' : `<div class="calf-chips">${sets.map((s, i) =>
    `<button class="calf-chip${i === calfSheet.editIdx ? ' active' : ''}" onclick="editCalfSet(${i})"><b>S${i + 1}</b> ${h(fmtSet(s))}</button>`
  ).join('')}</div>`;
  const action = editing
    ? `<div class="calf-actions"><button class="calf-remove" onclick="removeCalfSet()">Remove</button>
       <button class="card-log-btn" id="calfSheetBtn" onclick="logCalfSet()">UPDATE SET ${setNo}</button></div>`
    : `<button class="card-log-btn" id="calfSheetBtn" onclick="logCalfSet()">LOG SET ${setNo}</button>`;

  document.getElementById('calfSheet').innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div><div class="sheet-title" id="calfSheetTitle">${h(ex.title)}</div><div class="sheet-sub">${h(status)}</div></div>
      <div class="set-dots">${Array.from({ length: Math.max(side.sets, sets.length) }, (_, i) =>
        `<i class="${i < sets.length ? 'filled' : ''}"></i>`).join('')}</div>
    </div>
    ${seg}
    <div class="stepper">
      <button class="stepper-btn" onclick="stepCalfDraft('${prop}',-1)" aria-label="One less">−</button>
      <div class="stepper-val"><b>${val}</b><span class="input-lbl">${prop === 'seconds' ? 'Seconds' : 'Reps'}</span></div>
      <button class="stepper-btn" onclick="stepCalfDraft('${prop}',1)" aria-label="One more">+</button>
    </div>
    <div class="quick-reps">${quick.map(n =>
      `<button class="${n === val ? 'active' : ''}" onclick="setCalfDraft('${prop}',${n})">${n}</button>`).join('')}</div>
    ${weight}${level}${chips}${action}`;
}

function logCalfSet() {
  const { ex, side } = calfSheetCtx();
  const prop = calfValueProp(ex);
  const d = calfSheet.draft;
  const set = { [prop]: Number(d[prop]) };
  if (ex.kind === 'repsWeight') set.weight = Number(d.weight);
  if (side.level) set[side.level.prop] = d[side.level.prop] || null;

  const sets = calfSetsState[side.key];
  const wasEdit = calfSheet.editIdx != null;
  if (wasEdit) sets[calfSheet.editIdx] = set; else sets.push(set);
  calfSheet.editIdx = null;
  saveCalfEntry();
  renderCalfDay();

  // Stay on this side until its sets are done, then move to the other side, then close
  if (!wasEdit && sets.length >= side.sets) {
    const next = ex.sides.find(s => calfSets(s).length < s.sets);
    if (!next) {
      const btn = document.getElementById('calfSheetBtn');
      btn.textContent = '✓';
      btn.style.background = 'var(--green)';
      btn.disabled = true;
      setTimeout(closeCalfSheet, 600);
      return;
    }
    calfSheet.sideKey = next.key;
  }
  calfSheet.draft = calfDraft(ex, calfSheetCtx().side);
  renderCalfSheet();
}

function removeCalfSet() {
  const { ex, side } = calfSheetCtx();
  calfSetsState[side.key].splice(calfSheet.editIdx, 1);
  calfSheet.editIdx = null;
  calfSheet.draft = calfDraft(ex, side);
  saveCalfEntry();
  renderCalfDay();
  renderCalfSheet();
}

// ─── CALF SAVE ────────────────────────────────────────────────────────────────
function buildCalfEntry(dateStr) {
  const sets = {};
  CALF_SET_KEYS.forEach(k => { sets[k] = (calfSetsState[k] || []).map(s => ({ ...s })); });
  const assistVals = sets.heelRaiseLeft.map(s => ASSIST_VALUE[s.assist]).filter(Boolean);
  const assistAvg = assistVals.length ? assistVals.reduce((a, b) => a + b, 0) / assistVals.length : null;
  return {
    date: dateStr,
    dayType: CALF_DAYTYPE_LABEL[calfDayType(dateStr)],
    assist: assistAvg ? ASSIST_LEVELS[Math.round(assistAvg) - 1] : '',
    assistAvg,
    ...sets,
    priorActivity: document.getElementById('calfPriorActivity').value.trim(),
    soreness: document.getElementById('calfSoreness').value.trim(),
  };
}

// Every set and note change upserts the day's entry. Saves run one at a time so a quick
// second set finds the record the first one created instead of creating another.
function saveCalfEntry() {
  const entry = buildCalfEntry(calfDay);
  calfSaveChain = calfSaveChain.then(() => persistCalfEntry(entry));
  return calfSaveChain;
}

async function persistCalfEntry(entry) {
  const existing = calfLogs.find(l => l.date === entry.date);
  entry.timestamp = existing ? existing.timestamp : new Date().toISOString();

  abortLoad();
  setSync('syncing', 'Saving...');
  try {
    if (existing && !existing.id.startsWith('local-')) {
      entry.id = existing.id;
      await updateCalfLog(entry);
    } else {
      entry.id = await createCalfLog(entry);
    }
    calfLogs = calfLogs.filter(l => l.date !== entry.date);
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Saved ✓');
  } catch (e) {
    console.error(e);
    if (!entry.id) entry.id = existing ? existing.id : localId();
    calfLogs = calfLogs.filter(l => l.date !== entry.date);
    calfLogs.unshift(entry);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('err', 'Saved locally');
    if (!calfOfflineWarned) {
      calfOfflineWarned = true;
      alert('Airtable unavailable — kept locally.\n\n' + e.message);
    }
  }

  renderCalfWeek();
  renderCalfChart();
  renderHistory();
}
async function deleteCalfEntry(id) {
  if (!confirm('Delete this entry?')) return;
  abortLoad();
  setSync('syncing', 'Deleting...');
  try {
    if (id && !id.startsWith('local-')) await deleteCalfLog(id);
    calfLogs = calfLogs.filter(l => l.id !== id);
    localStorage.setItem(CALF_CACHE_KEY, JSON.stringify(calfLogs));
    setSync('ok', 'Deleted');
    renderCalfWeek();
    renderCalfChart();
    renderHistory();
  } catch (e) {
    console.error(e);
    setSync('err', 'Delete failed');
    alert('Delete failed.\n\n' + e.message);
  }
}

function renderCalfWeek() {
  const strip = document.getElementById('calfWeekStrip');
  strip.innerHTML = '';
  const todayKey = localDateKey(new Date());
  const day = new Date((calfDay || todayKey) + 'T12:00:00');
  const dow = day.getDay(); // 0=Sun..6=Sat
  const monday = addDays(day, dow === 0 ? -6 : 1 - dow);

  // A day counts as logged once it has at least one set (notes alone don't count)
  const loggedDates = new Set(calfLogs.filter(l => CALF_SET_KEYS.some(k => (l[k] || []).length)).map(l => l.date));
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  for (let i = 0; i < 7; i++) {
    const ds = localDateKey(addDays(monday, i));
    const type = calfDayType(ds); // 'A'|'B'|'Off'
    const isFuture = ds > todayKey;
    const isLogged = loggedDates.has(ds);

    const wrap = document.createElement('button');
    wrap.className = 'week-day calf-week-day';
    wrap.disabled = isFuture;
    wrap.onclick = () => setCalfDay(ds);
    wrap.setAttribute('aria-label', `${fmtDow(ds)} ${fmtDate(ds)}, ${CALF_DAYTYPE_LABEL[type]}`);
    const dot = document.createElement('div');
    dot.className = 'week-dot' +
      (type === 'Off' ? ' off-day' : '') +
      (type === 'B' ? ' b-day' : '') +
      (isLogged ? ' trained' : isFuture ? ' future' : (type !== 'Off' && ds < todayKey ? ' missed' : '')) +
      (ds === calfDay ? ' selected' : '');
    dot.textContent = type === 'Off' ? '' : type;
    const lbl = document.createElement('div'); lbl.className = 'week-dot-lbl';
    lbl.textContent = labels[i];
    wrap.appendChild(dot); wrap.appendChild(lbl); strip.appendChild(wrap);
  }
}

function renderCalfChart() {
  if (calfCharts.trend) { calfCharts.trend.destroy(); delete calfCharts.trend; }

  const isoEntries = calfLogs
    .filter(l => (l.isoHoldLeft || []).length || (l.isoHoldRight || []).length)
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date));

  const block = document.getElementById('calfChartBlock');
  if (!block) return; // only on Progress with the Calf hold pill selected
  if (isoEntries.length === 0) {
    block.innerHTML = '<div class="chart-empty">No iso hold entries yet</div>';
    return;
  }
  if (!document.getElementById('calfChart')) {
    block.innerHTML = '<div class="chart-wrap"><canvas id="calfChart"></canvas></div>';
  }

  // Fill every scheduled A-day between first entry and today so missed A-days show as gaps
  const first = new Date(isoEntries[0].date + 'T00:00:00');
  const last = new Date();
  const byDate = {};
  isoEntries.forEach(e => { byDate[e.date] = e; });
  const best = arr => arr.length ? Math.max(...arr.map(s => s.seconds)) : null;

  const pts = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    const ds = localDateKey(d);
    if (calfDayType(ds) !== 'A') continue;
    const e = byDate[ds];
    const left = e?.isoHoldLeft || [], right = e?.isoHoldRight || [];
    pts.push({ date: ds, logged: !!e, left, right, bestLeft: best(left), bestRight: best(right) });
  }

  const side = (label, key, color) => ({
    label,
    data: pts.map(p => p[key]),
    spanGaps: false,
    borderColor: color,
    backgroundColor: color + '20',
    pointStyle: pts.map(p => p.logged ? 'circle' : 'crossRot'),
    pointBackgroundColor: pts.map(p => p.logged ? color : VARIANT_MISSED_COLOR),
    pointRadius: 4,
    pointHoverRadius: 6,
    borderWidth: 2,
    fill: false,
    tension: 0.3,
  });

  const ctx = document.getElementById('calfChart').getContext('2d');
  calfCharts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels: pts.map(p => fmtDate(p.date)),
      datasets: [side('Left', 'bestLeft', '#5b8def'), side('Right', 'bestRight', '#e8a020')],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: '#9b98a0', boxWidth: 10, font: { size: 11 } } },
        tooltip: {
          backgroundColor: '#141416',
          borderColor: '#2a2a30',
          borderWidth: 1,
          titleColor: '#e8e6e0',
          bodyColor: '#9b98a0',
          callbacks: {
            label: item => {
              const p = pts[item.dataIndex];
              if (!p.logged) return 'Not logged';
              const holds = item.datasetIndex === 0 ? p.left : p.right;
              return `${item.dataset.label}: ${holds.length ? holds.map(fmtHold).join(', ') : '—'}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#6b6870', font: { size: 10 }, maxTicksLimit: 7 },
          grid: { color: '#1c1c20' },
        },
        y: {
          min: 0, max: 30,
          ticks: { color: '#6b6870', font: { size: 10 }, stepSize: 10, callback: v => v + 's' },
          grid: { color: '#1c1c20' },
        },
      },
    },
  });
}

const fmtHold = s => (s.pull || s.grip) ? `${s.seconds}s (${s.pull || s.grip})` : `${s.seconds}s`;

// Most common left heel-raise pull level, for the history summary
function calfPullSummary(l) {
  const counts = {};
  (l.heelRaiseLeft || []).forEach(s => { if (s.pull) counts[s.pull] = (counts[s.pull] || 0) + 1; });
  return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || '';
}

function renderCalfSetDetail(l) {
  const lines = [];
  const hrL = l.heelRaiseLeft || [], hrR = l.heelRaiseRight || [];
  if (hrL.length || hrR.length) {
    const lStr = hrL.map(s => (s.pull || s.assist) ? `${s.reps} (${s.pull || s.assist})` : `${s.reps}`).join(', ');
    const rStr = hrR.map(s => s.reps).join(', ');
    lines.push(`Heel raise${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const btL = l.bigToeLeft || [], btR = l.bigToeRight || [];
  if (btL.length || btR.length) {
    const lStr = btL.map(s => `${s.seconds}s`).join(', ');
    const rStr = btR.map(s => `${s.seconds}s`).join(', ');
    lines.push(`Big-toe press${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const seated = l.seatedCalfRaise || [];
  if (seated.length) {
    lines.push(`Seated calf raise — ${seated.map(s => `${s.reps}×${s.weight}kg`).join(', ')}`);
  }
  const ihL = l.isoHoldLeft || [], ihR = l.isoHoldRight || [];
  if (ihL.length || ihR.length) {
    const fmt = arr => arr.map(fmtHold).join(', ');
    const lStr = fmt(ihL), rStr = fmt(ihR);
    lines.push(`Iso hold${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  const bkL = l.bentKneeLeft || [], bkR = l.bentKneeRight || [];
  if (bkL.length || bkR.length) {
    const fmt = arr => arr.map(s => `${s.reps}×${s.weight}kg`).join(', ');
    const lStr = fmt(bkL), rStr = fmt(bkR);
    lines.push(`Bent-knee heel raise${lStr ? ` — L: ${lStr}` : ''}${rStr ? `${lStr ? ' · ' : ' — '}R: ${rStr}` : ''}`);
  }
  return lines.map(line => `<span>${h(line)}</span>`).join('');
}

function calfHistoryItems() {
  return calfLogs.slice(0, 120).map(l => {
    const setDetail = renderCalfSetDetail(l);
    const level = l.assist || calfPullSummary(l);
    return { date: l.date, html: `
    <div class="hist-item">
      ${histHead(l.date, 'Calf')}
      <div class="hist-calf-row">
        <span>${h(l.dayType)}${level ? ` · <span class="hist-calf-assist">${h(level)}</span>` : ''}</span>
        ${l.priorActivity ? `<span>Prior: ${h(l.priorActivity)}</span>` : ''}
        ${l.soreness ? `<span>Soreness: ${h(l.soreness)}</span>` : ''}
      </div>
      ${setDetail ? `<div class="hist-calf-row">${setDetail}</div>` : ''}
      <div class="hist-records">
        <div class="hist-record">
          <span></span>
          <button class="hist-del" onclick="deleteCalfEntry('${esc(l.id)}')" title="Delete">×</button>
        </div>
      </div>
    </div>` };
  });
}

// ─── EXPORT ───────────────────────────────────────────────────────────────────
function csvField(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const header = ['Date', 'Time', 'Exercise', 'Variant', 'Sets', 'Reps', 'Total Reps', 'Notes'];
  const rows = [header];

  logs.forEach(log => {
    const time = log.timestamp
      ? new Date(log.timestamp).toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false })
      : '';
    EXERCISES.forEach(ex => {
      const d = log[ex.key];
      if (d.sets == null && d.reps == null) return;
      rows.push([
        log.date,
        time,
        ex.label,
        d.variant || '',
        d.sets ?? '',
        d.reps ?? '',
        (d.sets != null && d.reps != null) ? d.sets * d.reps : '',
        log.notes || '',
      ]);
    });
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `greyskull-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCalfCSV() {
  const header = ['Date', 'DayType', 'Exercise', 'Side', 'Set', 'Reps', 'Seconds', 'Weight_kg', 'Assist', 'Grip', 'Pull', 'PriorActivity', 'Soreness'];
  const rows = [header];

  const pushRows = (l, arr, exLabel, side, repsKey, secondsKey, weightKey) => {
    (arr || []).forEach((s, idx) => {
      rows.push([
        l.date, l.dayType, exLabel, side, idx + 1,
        repsKey ? (s[repsKey] ?? '') : '',
        secondsKey ? (s[secondsKey] ?? '') : '',
        weightKey ? (s[weightKey] ?? '') : '',
        s.assist || '',
        s.grip || '',
        s.pull || '',
        l.priorActivity || '',
        l.soreness || '',
      ]);
    });
  };

  calfLogs.forEach(l => {
    pushRows(l, l.heelRaiseLeft,    'Heel raise',        'Left',  'reps', null, null);
    pushRows(l, l.heelRaiseRight,   'Heel raise',        'Right', 'reps', null, null);
    pushRows(l, l.bigToeLeft,       'Big-toe press',     'Left',  null, 'seconds', null);
    pushRows(l, l.bigToeRight,      'Big-toe press',     'Right', null, 'seconds', null);
    pushRows(l, l.seatedCalfRaise,  'Seated calf raise', '',      'reps', null, 'weight');
    pushRows(l, l.isoHoldLeft,      'Iso hold',          'Left',  null, 'seconds', null);
    pushRows(l, l.isoHoldRight,     'Iso hold',          'Right', null, 'seconds', null);
    pushRows(l, l.bentKneeLeft,     'Bent-knee heel raise', 'Left',  'reps', null, 'weight');
    pushRows(l, l.bentKneeRight,    'Bent-knee heel raise', 'Right', 'reps', null, 'weight');
  });

  const csv = rows.map(row => row.map(csvField).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `calf-export-${localDateKey(new Date())}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
const READY_AFTER_MS = 60 * 60 * 1000;
function timeSinceLastSet(key) {
  const entry = logs.find(l => l[key].reps != null);
  if (!entry || !entry.timestamp) return null;
  const secs = Math.floor((Date.now() - new Date(entry.timestamp).getTime()) / 1000);
  if (secs < 60) return `${secs}s ago`;
  const mins = Math.floor(secs / 60);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}
function localDateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function logKey(l) { return l.id || l.timestamp; }
function localId() { return 'local-' + (window.crypto?.randomUUID?.() || Date.now()); }
function fmtDate(ds) {
  const d = new Date(ds + 'T12:00:00');
  return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
}
function fmtDow(ds) {
  return new Date(ds + 'T12:00:00').toLocaleDateString('en-AU', { weekday: 'long' });
}
function h(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(v) { return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

(() => {
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('logDate').textContent = `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
})();

load();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load(true);
});
window.addEventListener('pageshow', (e) => {
  if (e.persisted) load(true);
});
window.addEventListener('online', () => load(true));
</script>
